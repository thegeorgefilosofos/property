
# Edge function configuration. verify_jwt governs whether the Supabase gateway
# requires a valid JWT before the function runs:
#   false  → cron / token / service functions that enforce their own auth
#            (x-cron-secret, capability token, or service-role bearer) and must be
#            reachable by pg_net/cron without a user session.
#   true   → user-facing functions that require the caller's own JWT.
# Καμία function δεν χρησιμοποιεί import map. Τέσσερα deno.json υπήρχαν εδώ και
# ήταν ΝΕΚΡΑ: δήλωναν «@supabase/functions-js» και «@supabase/server», specifiers
# που κανένα index.ts δεν εισήγαγε ποτέ. Γεννήθηκαν από `supabase functions new`
# — στο ίδιο commit που τα δημιούργησε, ο κώδικας ήδη έκανε import από αλλού.
# Ήταν αβλαβή (οι αχρησιμοποίητες καταχωρήσεις δεν επιλύονται ποτέ) αλλά δήλωναν
# κυμαινόμενα εύρη ^2 και ^1 — ακριβώς η ασθένεια που μόλις διώξαμε από τα
# imports. Οι εξαρτήσεις δηλώνονται πλέον inline: npm:<pkg>@<ακριβής έκδοση>.

# ── User-facing (require the caller's JWT) ──────────────────────────────────
[functions.smart-suggestions]
enabled = true
verify_jwt = true

[functions.send-client-email]
enabled = true
verify_jwt = true

[functions.send-org-invite]
enabled = true
verify_jwt = true

[functions.send-test-notification]
enabled = true
verify_jwt = true

# ── Cron / token / service (enforce their own auth) ─────────────────────────
[functions.send-reminders]
enabled = true
verify_jwt = false

