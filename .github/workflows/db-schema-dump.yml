name: DB schema dump (read-only)

# One-off, READ-ONLY utility: dumps the linked project's schema so we can build a
# migration baseline (audit finding 16). It never writes to the database — only
# `supabase db dump`, which is a pg_dump under the hood. Manual trigger only.
# From main it targets production; from a feature branch it targets staging.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ github.ref == 'refs/heads/main' && 'aromvduuxtcrzmwwvnej' || 'rheufrfscmngpjayxgln' }}
      SUPABASE_DB_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_DB_PASSWORD || secrets.STAGING_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Full schema (DDL) of the public schema — tables, columns, constraints,
      # indexes, functions, policies, triggers, views. This is our source of truth
      # for the base-table structures the migrations assume already exist.
      - name: Dump public schema
        run: supabase db dump --linked -f schema-public.sql

      - uses: actions/upload-artifact@v4
        with:
          name: db-schema
          path: schema-public.sql
          retention-days: 3
