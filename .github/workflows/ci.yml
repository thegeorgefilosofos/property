name: CI

# Quality gate: runs on every pull request to main and on feature-branch pushes.
# Typecheck, the domain test-suite, and a production build must pass; lint is
# reported but non-blocking (informational). Fast, no secrets, no deploy — this
# only verifies the code is sound before it can be merged.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational)
        run: npm run lint || true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (domain + messaging verifiers)
        run: npm run test

      - name: Production build
        run: npm run build
