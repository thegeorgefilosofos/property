name: CI

# Quality gate: runs on every pull request to main and on feature-branch pushes.
# A secret scan, the lint-debt ratchet (error count may only go down), typecheck,
# the domain test-suite, and a production build must all pass. Fast, no secrets,
# no deploy — this only verifies the code is sound before it can be merged.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']

permissions:
  contents: read

# Collapse the PR-event and push-event runs of the SAME branch into one group
# (head_ref is set on pull_request, ref_name on push — both resolve to the branch
# name), so a feature branch with an open PR doesn't run CI twice in parallel.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security scan (secrets / forbidden files) — blocking
        run: npm run security

      - name: Lint ratchet (errors may only go down) — blocking
        run: npm run lint:ratchet

      - name: Typecheck
        run: npx tsc --noEmit

      # Το tsc ΔΕΝ πιάνει το σύνορο server/πελάτη: ο τύπος είναι σωστός, η τιμή
      # στον χρόνο εκτέλεσης όχι. Όταν Server Component διάβασε `T` από το
      # `'use client'` Theme.tsx, ολόκληρο το δημόσιο site (αρχική, «Ποιοι
      # είμαστε», Απόρρητο, Όροι) έδειχνε «Κάτι πήγε στραβά» — με το build
      # απολύτως πράσινο. Αυτός ο έλεγχος είναι το μόνο πράγμα που το πιάνει.
      - name: Server/client boundary (τιμές από module πελάτη) — blocking
        run: node scripts/check-server-imports.mjs

      # Οι edge functions ΔΕΝ καλύπτονται από το tsc: το tsconfig.json εξαιρεί
      # ρητά το `supabase/`, επειδή τρέχουν σε Deno και όχι σε Node. Μέχρι σήμερα
      # αυτό σήμαινε ότι ο ΠΡΩΤΟΣ έλεγχος τύπων τους γινόταν τη στιγμή του deploy
      # στην παραγωγή — και μάλιστα ΜΕΤΑ το `db push`, δηλαδή με τα migrations ήδη
      # εφαρμοσμένα. Ένα σφάλμα τύπου σήμαινε βάση μπροστά, κώδικα πίσω.
      #
      # Η έκδοση 2.1.4 είναι αυτή που κάνει vendor το Supabase edge-runtime.
      - name: Typecheck edge functions (Deno)
        run: npx --yes deno@2.1.4 check supabase/functions/*/index.ts

      # Τα χρήματα ζουν σε δύο πίνακες (bills και expenses) και κάθε οθόνη που
      # τα αθροίζει μόνη της μπορεί να βγάλει άλλο σύνολο. Βρέθηκαν τρεις τέτοιες
      # οθόνες, με τρία διαφορετικά νούμερα για το ίδιο ακίνητο. Δεν κρασάρει
      # τίποτα: απλώς ο ιδιοκτήτης που θα εντοπίσει ΕΝΑ λάθος νούμερο παύει να
      # εμπιστεύεται όλα τα υπόλοιπα, και δίκαια. Ratchet: το χρέος μόνο πέφτει.
      # Μία ανάθεση σε επίπεδο module πάνω σε πακέτο UMD έκλεισε την εφαρμογή
      # έξω: `qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']`. Όταν
      # ο bundler άλλαξε σχήμα interop, η γραμμή πέταξε ΠΡΙΝ αποδοθεί οτιδήποτε
      # και δεν φόρτωσε ολόκληρος ο πίνακας ελέγχου. Κανένα error boundary δεν
      # πιάνει chunk που δεν αξιολογήθηκε ποτέ.
      - name: No module-scope work on packages — blocking
        run: node scripts/check-module-init.mjs

      - name: Money reads through one core — blocking
        run: node scripts/money-reads.mjs

      # Το parseAmount υπήρχε σε ΤΡΙΑ αρχεία και το parseDate σε άλλα τρία — και
      # ΔΙΑΦΩΝΟΥΣΑΝ: το «1.234» διαβαζόταν 1,23 € από τη μία οθόνη και 1.234 € από
      # την άλλη, το «3/15/2026» έβγαζε μήνα 15 στη βάση, και το ίδιο ΑΦΜ ήταν
      # έγκυρο εδώ και άκυρο δίπλα. Κανένα test δεν έπεφτε: κάθε αντίγραφο περνούσε
      # τα δικά του. Ο έλεγχος επιτρέπει τύλιγμα που ΚΑΛΕΙ την πηγή, όχι δεύτερη
      # υλοποίηση.
      - name: Μία λειτουργία, ένα σημείο — blocking
        run: node scripts/guard-single-source.mjs

      # Ο πελάτης του Supabase ΔΕΝ πετάει σε σφάλμα βάσης — γυρίζει { data, error }.
      # Άρα κάθε try/catch γύρω από γράψιμο «πετυχαίνει» πάντα: ο χρήστης διαβάζει
      # «Αποθηκεύτηκε» και η γραμμή δεν υπάρχει. Μετρήθηκαν 184 γραψίματα χωρίς
      # κανέναν έλεγχο, από 297 συνολικά. Ratchet: το υπάρχον χρέος επιτρέπεται,
      # νέο όχι — και το όριο κατεβαίνει όσο διορθώνονται.
      - name: Γραψίματα με έλεγχο σφάλματος — blocking
        run: node scripts/unchecked-writes.mjs

      # Το app έχει σκοτεινό θέμα. Ένα καρφωμένο #fff ή #111 δουλεύει σε ένα από
      # τα δύο θέματα και σπάει ΣΙΩΠΗΛΑ στο άλλο — καμία δοκιμή δεν το πιάνει,
      # γιατί τίποτα δεν κρασάρει: απλώς κάποιος βλέπει λευκά γράμματα σε λευκό.
      # Μετρήθηκαν 232 μοναδικά χρώματα, 57 μπλε και 23 πράσινα, από τρεις ξένες
      # παλέτες μαζί. Ratchet: το υπάρχον χρέος επιτρέπεται, το νέο όχι.
      - name: Χρώμα μόνο από tokens — blocking
        run: node scripts/color-ratchet.mjs

      # Η άλλη πλευρά του ίδιου νομίσματος: το χρώμα ΜΠΟΡΕΙ να έρχεται από token
      # που δεν υπάρχει. Το CSS αγνοεί σιωπηλά ό,τι δεν καταλαβαίνει — χωρίς
      # εφεδρική τιμή πετάει ΟΛΗ τη δήλωση. Έτσι ο υπότιτλος της αρχικής σελίδας
      # έβγαινε σε κληρονομημένο χρώμα και η σελίδα σφάλματος είχε αντίθεση
      # 2.66:1 στο σκούρο θέμα. Ούτε ο TypeScript ούτε ο linter το πιάνουν.
      - name: Κάθε token που ζητείται να υπάρχει — blocking
        run: node scripts/guard-tokens.mjs

      # Και η ΤΡΙΤΗ πλευρά: το token υπάρχει, αλλά ΜΟΝΟ σε ένα από τα δύο θέματα.
      # Οι δέκα σημασιολογικοί τόνοι (--accent-soft, --negative-border και οι
      # υπόλοιποι) ήταν δηλωμένοι μόνο μέσα στο `:root[data-mode="light"]`, ενώ
      # το σκούρο είναι η ΒΑΣΗ. Αποτέλεσμα στο προεπιλεγμένο θέμα: κάθε
      # `background: var(--accent-soft)` έπεφτε σε διάφανο, και κάθε
      # `border: 1px solid var(--negative-border)` γινόταν ΟΛΟΚΛΗΡΟ άκυρο —
      # δηλαδή border-style: none, το περίγραμμα εξαφανιζόταν. Τετρακόσιες δέκα
      # χρήσεις σε πενήντα πέντε αρχεία, και το φωτεινό θέμα δούλευε τέλεια,
      # οπότε όποιος δοκίμαζε εκεί δεν έβλεπε τίποτα.
      - name: Κάθε token να υπάρχει και στα ΔΥΟ θέματα — blocking
        run: node scripts/guard-theme-tokens.mjs

      # Η παύλα δεν είναι ούτε λέξη ούτε αριθμός: σε στήλη ποσών τρυπάει τη
      # γραμμή, και σε τρία σημεία χρησίμευε ΚΑΙ ως σημάδι λογικής — που έσπασε
      # σιωπηλά μόλις άλλαξε το κείμενο. Καστάνια: μόνο προς τα κάτω.
      - name: Καμία νέα παύλα σε θέση τιμής — blocking
        run: node scripts/guard-dashes.mjs

      # Έλεγχος γραμμένος μετά τη γραμμή αναφοράς εκτελείται, αλλά κανείς δεν
      # κοιτάζει το αποτέλεσμά του: η σουίτα λέει «πέρασαν» ό,τι κι αν βρει.
      # Συνέβη ΤΡΕΙΣ φορές μέσα στην ίδια μέρα, γιατί το «πρόσθεσε στο τέλος»
      # είναι η πιο φυσική κίνηση. Δεν διορθώνεται με προσοχή· με φύλακα.
      - name: Κανένας έλεγχος μετά τη γραμμή αναφοράς — blocking
        run: node scripts/guard-test-tail.mjs

      # Ο server τρέχει σε UTC, η Ελλάδα είναι UTC+2/+3. Κάθε ημερολογιακή
      # ημερομηνία βγαλμένη από toISOString() ήταν λάθος για δύο ως τρεις ώρες
      # κάθε νύχτα: δαπάνη της 1ης Ιουλίου στη 1 π.μ. καταγραφόταν ως 30ή Ιουνίου,
      # δηλαδή σε ΛΑΘΟΣ ΦΟΡΟΛΟΓΙΚΟ ΜΗΝΑ. Μετρήθηκαν 35 σημεία και μηδενίστηκαν.
      - name: Το «σήμερα» βγαίνει από ελληνική ώρα — blocking
        run: node scripts/greek-time.mjs

      # Η Postgres ΔΕΝ ελέγχει το σώμα μιας plpgsql συνάρτησης στο `create`: το
      # αποθηκεύει ως κείμενο και το επαληθεύει μόνο στην εκτέλεση. Έτσι η
      # `get_portal_data` σύγκρινε uuid με text σε τρία migrations στη σειρά και
      # πετούσε 42883 σε ΚΑΘΕ κλήση — η Πύλη Ενοικιαστή δεν άνοιξε ποτέ και καμία
      # φόρμα βλάβης δεν καταχωρήθηκε, με όλα τα deploy πράσινα. Εδώ ελέγχεται η
      # ΖΩΝΤΑΝΗ έκδοση κάθε συνάρτησης, όχι η ιστορία των εφαρμοσμένων αρχείων.
      - name: Τύποι SQL στις συναρτήσεις συνδέσμων — blocking
        run: node scripts/guard-sql-types.mjs

      # Ο πίνακας `tenants` δεν είχε ΠΟΤΕ στήλη `created_at` — και δέκα σημεία την
      # ταξινομούσαν μ' αυτήν. Το PostgREST απορρίπτει ΟΛΟΚΛΗΡΟ το ερώτημα σε
      # άγνωστη στήλη: η καρτέλα Ενοικιαστή δεν φόρτωνε, το Ε2 δεν έβγαινε, ο
      # φάκελος του λογιστή γύριζε κενός — και η οθόνη έδειχνε κενό, όχι σφάλμα.
      # Ούτε ο TypeScript ούτε το build το πιάνουν: τα ονόματα στηλών είναι strings.
      # Ratchet: 26 γνωστές αναφορές (21 στον πίνακα loans), νέες δεν επιτρέπονται.
      - name: Στήλες που ζητά ο κώδικας να υπάρχουν — blocking
        run: node scripts/guard-schema-drift.mjs

      # Οι νέες κλίμακες ενοικίων ισχύουν για εισοδήματα ΑΠΟ 1/1/2026. Οι οθόνες
      # ΕΠΙΛΕΓΟΥΝ έτος —η Πύλη Λογιστή ξεκινά στο προηγούμενο— αλλά καμία δεν
      # περνούσε κλίμακα, οπότε κάθε δήλωση του 2025 έβγαινε με τους συντελεστές
      # του 2026: σε 20.000 € ενοίκια, 3.550 € αντί για 4.250 € — υποεκτίμηση 16%
      # ακριβώς στη δήλωση που υποβάλλεται σήμερα. Ο τύπος ήταν σωστός και η
      # κλίμακα σωστή· απλώς ΑΛΛΗΣ ΧΡΟΝΙΑΣ, και ένα test μονάδας περνά και στις δύο.
      - name: Η κλίμακα ακολουθεί το έτος — blocking
        run: node scripts/guard-tax-year.mjs

      # Το `toFixed(1)` γράφει ΠΑΝΤΑ τελεία, ανεξάρτητα από γλώσσα. Βρέθηκαν 31
      # σημεία που έδειχναν «4.2%» ακριβώς δίπλα σε ποσά «1.234,56 €»: δύο
      # συστήματα αρίθμησης στην ίδια γραμμή. Στα ελληνικά η τελεία είναι
      # χωριστής ΧΙΛΙΑΔΩΝ, οπότε το «4.200» διαβαζόταν τέσσερις χιλιάδες. Πέντε
      # ακόμη σημεία το είχαν λύσει χειροκίνητα με `.replace('.', ',')` — πέντε
      # υλοποιήσεις του ίδιου πράγματος, δηλαδή πέντε ευκαιρίες να διαφωνήσουν.
      - name: Ελληνικοί αριθμοί στην οθόνη — blocking
        run: node scripts/guard-greek-numbers.mjs

      # Το «${…}» σε ΜΟΝΑ εισαγωγικά δεν αντικαθίσταται ποτέ: μένουν τα σύμβολα.
      # Βρέθηκαν δώδεκα, όλα από την ίδια μαζική αλλαγή χρωμάτων — ανάμεσά τους
      # το χρώμα κειμένου στις μπάρες κρατήσεων του ημερολογίου, το τσεκάκι της
      # τυπωμένης λίστας εκκρεμοτήτων και η προεπισκόπηση της κεφαλίδας του
      # brand. Ούτε ο TypeScript ούτε ο linter το πιάνουν: η συμβολοσειρά είναι
      # συντακτικά άψογη. Ο έλεγχος ρωτά τον αναλυτή του TypeScript, όχι regex.
      - name: Καμία νεκρή αντικατάσταση προτύπου — blocking
        run: node scripts/guard-dead-interpolation.mjs

      # Στη React το `{αριθμός && <…>}` ΤΥΠΩΝΕΙ τον χαρακτήρα «0» — μόνο τα false,
      # null και undefined εξαφανίζονται. Βρέθηκαν έξι σημεία, ανάμεσά τους το
      # σήμα καρτέλας του φακέλου ενοικιαστή, όπου το `tb.badge > 0` είχε γραφτεί
      # ΑΚΡΙΒΩΣ για να μη φαίνεται μηδενικό σήμα και το `tb.badge &&` μπροστά του
      # το ακύρωνε. Το ερώτημα είναι τυπικό, όχι συντακτικό: μια regex βρίσκει 591
      # υποψήφια και δεν ξέρει ποιο είναι αριθμός· ο ελεγκτής τύπων απαντά έξι.
      - name: Κανένα μηδέν τυπωμένο κατά λάθος — blocking
        run: node scripts/guard-rendered-zero.mjs

      # ΟΙ ΤΡΕΙΣ ΠΑΡΑΚΑΤΩ ΥΠΗΡΧΑΝ ΚΑΙ ΔΕΝ ΕΤΡΕΧΑΝ ΠΟΥΘΕΝΑ. Ήταν γραμμένοι,
      # δηλωμένοι στο package.json, και κανένα workflow δεν τους καλούσε: ένας
      # φύλακας που δεν τρέχει δεν φυλάει τίποτα, απλώς δίνει την εντύπωση ότι
      # φυλάει. Το ίδιο σφάλμα με τη σουίτα του confirmBus, που είχε γραφτεί και
      # δεν την έβρισκε ο εκτελεστής.
      - name: Δύο κενές καταστάσεις, όχι πέντε διατυπώσεις — blocking
        run: node scripts/guard-empty-states.mjs

      - name: Καμία ντόπια λίστα του λειτουργικού — blocking
        run: node scripts/guard-native-fields.mjs

      - name: Καμία εξαγωγή που δεν την καλεί κανείς — blocking
        run: node scripts/guard-dead-exports.mjs

      # Μέσα σε πολιτική RLS η auth.uid() είναι STABLE, όχι IMMUTABLE: αποτιμάται
      # ΓΙΑ ΚΑΘΕ ΓΡΑΜΜΗ που εξετάζεται. Ο ελεγκτής της Supabase βρήκε 118 τέτοιες
      # πολιτικές σε 63 πίνακες· ο φύλακας βρήκε άλλες 15 στο storage, που ο
      # ελεγκτής δεν σαρώνει καν. Τίποτα δεν σπάει — το κόστος φαίνεται μόνο όταν
      # ο πίνακας έχει ήδη μεγαλώσει, δηλαδή στον πρώτο πραγματικό πελάτη.
      - name: Καμία πολιτική RLS με auth.uid() ανά γραμμή — blocking
        run: node scripts/guard-rls-initplan.mjs

      # Η CSP μπαίνει ΜΟΝΟ στην παραγωγή. Μια εξωτερική κλήση που λείπει από το
      # connect-src δουλεύει τέλεια τοπικά και μπλοκάρεται εκεί — και όταν η
      # κλήση «αποτυγχάνει ήσυχα» (έλεγχος διαρρευσάντων κωδικών, αναφορά
      # σφαλμάτων), το χαρακτηριστικό δεν δουλεύει ΠΟΤΕ χωρίς να το πει κανείς.
      # Συνέβη δύο φορές την ίδια μέρα.
      - name: Κάθε εξωτερική κλήση δηλωμένη στην CSP — blocking
        run: node scripts/guard-csp-connect.mjs

      # Το κατέβασμα αρχείου ήταν γραμμένο ΕΠΤΑ φορές, και οι επτά διαφορετικά.
      # Τέσσερις ξεχνούσαν το appendChild — ο Firefox δεν κατεβάζει τίποτα σε
      # αποσυνδεδεμένο <a download>, σιωπηλά — και πέντε ανακαλούσαν τη διεύθυνση
      # του blob αμέσως μετά το κλικ, που ακυρώνει τα μεγάλα αρχεία. Δηλαδή τον
      # φάκελο του λογιστή. Ένα από τα επτά είχε ήδη τη σωστή καθυστέρηση: κάποιος
      # το είχε συναντήσει και τα άλλα έξι δεν το έμαθαν ποτέ.
      - name: Το κατέβασμα αρχείου σε ένα σημείο — blocking
        run: node scripts/guard-download.mjs

      # Η ίδια διάγνωση με το χρώμα: η τυπογραφική κλίμακα υπάρχει (TT) και δεν
      # επιβάλλεται. Μετρήθηκαν 2.715 δηλώσεις fontSize σε 23 διαφορετικά μεγέθη,
      # ενώ η κλίμακα ορίζει οκτώ. Και δεκαπέντε κείμενα κάτω από 9 εικονοστοιχεία,
      # πέντε από αυτά στα 7: δεν διαβάζονται από κανέναν πάνω από σαράντα, και ο
      # «50χρονος» είναι ρητά ένα από τα τρία πρόσωπα της στρατηγικής. Το δάπεδο
      # είναι απόλυτος κανόνας· τα υπόλοιπα καστάνια.
      - name: Τυπογραφία μόνο από την κλίμακα — blocking
        run: node scripts/guard-type-scale.mjs

      # Δεκατρείς διευθύνσεις ΑΑΔΕ σε δεκατρία αρχεία, και ΠΕΝΤΕ από αυτές για
      # το ίδιο πράγμα: τα μισθωτήρια. Το πολύ μία ήταν σωστή. Δεν γράφτηκαν την
      # ίδια μέρα — μαζεύτηκαν, μία-μία, κάθε φορά που κάποιος χρειάστηκε
      # σύνδεσμο και τον επικόλλησε. Ένας σύνδεσμος που πέφτει σε 404 μέσα σε
      # φορολογικό εργαλείο δεν χαλάει μόνο τον εαυτό του: ο χρήστης παύει να
      # εμπιστεύεται και τα νούμερα δίπλα του.
      - name: Οι διευθύνσεις της ΑΑΔΕ μόνο από το μητρώο — blocking
        run: node scripts/guard-official-links.mjs

      # Δεκαοκτώ εξαγωγές, ονόματα αρχείων σε ΤΡΕΙΣ γλώσσες: greeklish
      # («enoikio», «atzenta», «xartofylakio»), αγγλικά («checklist»,
      # «E2_property-os») και ελληνικά. Και δύο φορές ο ίδιος καθαρισμός με ASCII
      # κλάση, που έσβηνε ΚΑΘΕ ελληνικό χαρακτήρα: «Συγκριτικό Ιανουάριος 2026»
      # κατέβαινε ως «__2026.xlsx». Ο φάκελος λήψεων είναι το πρώτο πράγμα που
      # βλέπει ο χρήστης μετά το κουμπί.
      - name: Ελληνικά ονόματα αρχείων — blocking
        run: node scripts/guard-filenames.mjs

      # Χειρόγραφη σημαία κατάστασης δίπλα σε χειρόγραφη ημερομηνία. Βρέθηκε σε
      # τρία σημεία την ίδια μέρα: το «Σπίτι μου ΙΙ» έγραφε «Ενεργό · Λήγει
      # σύντομα» δέκα εβδομάδες αφότου είχαν κλείσει οι αιτήσεις, η ταξινόμηση
      # το κρατούσε πρώτο στη λίστα, και η κάρτα του μετρούσε αντίστροφα προς
      # λάθος ημερομηνία. Την ημέρα που γράφτηκαν, σημαία και ημερομηνία
      # συμφωνούσαν. Ο χρόνος περνά μόνος του· η σημαία όχι.
      - name: Καμία χειρόγραφη κατάσταση δίπλα σε προθεσμία — blocking
        run: node scripts/guard-stale-flags.mjs

      # Το monospace υπάρχει για να στοιχίζονται τα ΨΗΦΙΑ σε στήλη. Σε 45 σημεία
      # χρησιμοποιούνταν μέσα σε τρέχουσα πρόταση — και σε έξι γραμμές της κάρτας
      # τιμολογίου ακόμη και στην ΕΤΙΚΕΤΑ, με τη στοίχιση να γίνεται με δύο
      # κυριολεκτικά κενά. Ο κανόνας ήταν ήδη γραμμένος στο components/tokens.ts
      # και απλώς δεν επιβαλλόταν.
      - name: Monospace μόνο σε στήλες — blocking
        run: node scripts/guard-number-font.mjs

      # Η landing ξανάοριζε τα ΙΔΙΑ design tokens με ΑΛΛΕΣ τιμές (--bg-base
      # #070b12 αντί #202124, --text-primary #eef2f7 αντί #e8eaed): δύο χρωματικά
      # συστήματα με την ίδια ταμπέλα, και ο επισκέπτης να αλλάζει δέρμα τη στιγμή
      # της εγγραφής. Κανένας φύλακας δεν το έβλεπε, επειδή όλοι ελέγχουν αν
      # χρησιμοποιείται token — και εδώ το token ήταν σωστό, η ΤΙΜΗ απέκλινε.
      - name: Το θέμα της βιτρίνας δηλωμένο, όχι δανεικό — blocking
        run: node scripts/guard-landing-theme.mjs

      # Οκτώ πίνακες έχουν RLS χωρίς πολιτικές και μηδέν δικαιώματα για
      # anon/authenticated: τους αγγίζει μόνο ο service_role ή SECURITY DEFINER.
      # Ένα `supabase.from('referrals')` σε component δεν σκάει — γυρίζει άδειο,
      # και η οθόνη λέει «δεν έχεις προσκλήσεις» σε κάποιον που έχει.
      - name: Κανένας πίνακας μόνο-υπηρεσίας στον πελάτη — blocking
        run: node scripts/guard-service-only-tables.mjs

      # Οι συναρτήσεις του σχήματος `net` (pg_net) έχουν EXECUTE σε PUBLIC από
      # την πλατφόρμα και ΔΕΝ αλλάζει: ανήκουν στον supabase_admin. Σήμερα δεν
      # υπάρχει έκθεση επειδή καμία συνάρτηση του public δεν γεφυρώνει προς εκεί
      # για ρόλο πελάτη. Η μέρα που θα γραφτεί μία, η βάση γίνεται ανοιχτό proxy.
      - name: Καμία γέφυρα πελάτη προς pg_net — blocking
        run: node scripts/guard-http-bridge.mjs

      # 36 στοιχεία της εφαρμογής πατιόνταν μόνο με ποντίκι: κάρτες, γραμμές
      # απογραφής, ημέρες ημερολογίου. Ένα <div> με onClick δεν εστιάζεται με
      # Tab, δεν ενεργοποιείται με Enter, και ο αναγνώστης οθόνης το περνά για
      # κείμενο. Ο πενηντάρης της στρατηγικής μας, με τρέμουλο ή χωρίς ποντίκι,
      # δεν μπορούσε να χρησιμοποιήσει το εργαλείο.
      - name: Κάθε κλικ και με πληκτρολόγιο — blocking
        run: node scripts/guard-keyboard.mjs

      # Ο έλεγχος διαρρευσάντων κωδικών υπήρχε πλήρης, με tests, δηλωμένος στην
      # CSP, και συνδεδεμένος στο PasswordStrength — το μήνυμα εμφανιζόταν σωστά.
      # Και μετά ο χρήστης πατούσε «Εγγραφή» και ο κωδικός γινόταν δεκτός: το
      # εύρημα ζούσε μόνο μέσα στο component. Όλα τα κομμάτια πράσινα, προστασία
      # μηδενική.
      - name: Το εύρημα διαρροής φτάνει ως την υποβολή — blocking
        run: node scripts/guard-password-leak.mjs

      # Δύο σφάλματα της ίδιας οικογένειας: το πεδίο δηλώνει κάτι που ο χρήστης
      # δεν είπε ποτέ. Το κοινό NumberInput είχε placeholder «0» σε 108 πεδία, και
      # ο οδηγός νέου ακινήτου πρότεινε «85» τετραγωνικά και «145000» αξία —
      # νούμερα κάποιου άλλου, σε πεδία που ορίζουν κάθε υπολογισμό. Και 22 πεδία
      # δέχονταν αρνητικές κιλοβατώρες, αρνητικά τετραγωνικά, αρνητικό ΕΝΦΙΑ.
      - name: Κανένα πεδίο αριθμού δεν επινοεί τιμή — blocking
        run: node scripts/guard-number-fields.mjs

      # Τα ελληνικά δεν έχουν Title Case. Η απόδειξη ότι ήταν σφάλμα και όχι
      # σύμβαση, σε τρεις διαδοχικές γραμμές: «Χωρίς Σταθερό Τηλέφωνο», «Χωρίς
      # κάμερες», «Χωρίς αυτόματη πόρτα». Ο φύλακας κρατά μόνο το υποσύνολο όπου
      # το λάθος αποδεικνύεται — επωνυμίες και ονόματα προγραμμάτων μένουν.
      - name: Καμία ετικέτα σε Title Case — blocking
        run: node scripts/guard-greek-case.mjs

      # Οδηγία που δείχνει σε κουμπί που δεν υπάρχει. Βρέθηκε τέσσερις φορές σε
      # μία μέρα, με χειρότερη την πολιτική απορρήτου: νομικό κείμενο που
      # περιγράφει δικαίωμα φορητότητας δεδομένων με βήματα που δεν εκτελούνται.
      # Το κουμπί μετονομάζεται σε ένα αρχείο, η οδηγία μένει πίσω σε άλλο.
      - name: Καμία οδηγία προς χειριστήριο που δεν υπάρχει — blocking
        run: node scripts/guard-dangling-refs.mjs

      # Δεκατέσσερις τοπικοί μορφοποιητές ποσού και ποσοστού, ο καθένας με τη
      # δική του απόφαση για τα δεκαδικά — και το lib/core/format.ts είχε ήδη
      # γραφτεί ακριβώς για να μην υπάρχουν. Ο χρήστης έβλεπε «4,2%» δίπλα σε
      # «4,20%», και ο ενοικιαστής έπαιρνε SMS με «450 €» για ό,τι η οθόνη
      # έγραφε «450,00 €».
      - name: Ένας μορφοποιητής ποσού και ποσοστού — blocking
        run: node scripts/guard-local-formatters.mjs

      # Το «&» είναι λατινική συντομογραφία του «et». Στα ελληνικά γράφεται
      # «και», και μετρήθηκαν 125 εμφανίσεις — επικεφαλίδες, τίτλοι
      # πρωτοκόλλου, ακόμη και παραπομπές σε νόμους. Οκτώ εξαιρούνται ρητά:
      # είναι τιμές γραμμένες στη βάση, και αλλάζουν μόνο με migration.
      - name: Κανένα «&» σε ελληνικό κείμενο — blocking
        run: node scripts/guard-ampersand.mjs

      # Πενήντα έξι σημεία έδειχναν στον χρήστη το αγγλικό μήνυμα της Postgres:
      # «new row violates row-level security policy». Το χειρότερο ήταν το
      # «Failed to fetch» — η μόνη κατηγορία σφάλματος που ο χρήστης μπορεί να
      # διορθώσει μόνος του (κόπηκε το ίντερνετ), γραμμένη ώστε να μην το
      # καταλάβει. Το «τι» το ξέρει η οθόνη, το «γιατί» το μεταφράζει το
      # lib/core/dbError.ts, και το άγνωστο δεν τυπώνεται ποτέ στα αγγλικά.
      - name: Κανένα μήνυμα βάσης στην οθόνη — blocking
        run: node scripts/guard-raw-errors.mjs

      # Το «\b» της JavaScript ορίζεται πάνω στο ASCII \w, άρα δίπλα σε ελληνικό
      # γράμμα ΔΕΝ ταιριάζει ποτέ — ούτε καν στη σκέτη λέξη. Δεν σπάει τίποτα:
      # περνάει. Βρέθηκε σε επτά σημεία, μεταξύ τους ο κανόνας ορθογραφίας που
      # ο ίδιος ο φύλακας διαφήμιζε, ο έλεγχος διαρροής ονόματος ενοικιαστή στις
      # ειδοποιήσεις, και η αναγνώριση στηλών ευρώ στις εξαγωγές προς λογιστή.
      - name: Κανένα ASCII όριο λέξης δίπλα σε ελληνικά — blocking
        run: node scripts/guard-ascii-boundary.mjs

      # Το «→» μέσα σε πρόταση δεν είναι τυπογραφία, είναι συντομογραφία
      # προγραμματιστή — και δεν ανήκει στα ελληνικά, που έχουν λέξεις για ό,τι
      # λέει. Σε προϊόν που πουλιέται σε ιδιοκτήτες ακινήτων φαίνεται αυτόματο.
      # Τα ονόματα ελέγχων και τα σχόλια εξαιρούνται: δεν τα βλέπει χρήστης.
      - name: Κανένα βέλος σε κείμενο οθόνης — blocking
        run: node scripts/guard-no-arrows.mjs

      # Το <NumberInput> γράφει ετικέτα μόνο όταν του δοθεί. Οκτώ πεδία την
      # έπαιρναν από διπλανό κείμενο του γονιού — ο βλέπων καταλάβαινε, ο
      # αναγνώστης οθόνης άκουγε «πλαίσιο κειμένου». Ζητά ένα από τα τρία:
      # `label`, `id` με `htmlFor`, ή `ariaLabel`.
      - name: Κάθε αριθμητικό πεδίο με όνομα — blocking
        run: node scripts/guard-field-name.mjs

      # Η «—» δεν είναι ελληνικό σημείο στίξης. Σε 169 σημεία κειμένου οθόνης
      # το κείμενο διαβαζόταν παραγμένο και όχι γραμμένο. Και σε δύο σημεία δεν
      # ήταν ύφος: το συμφωνητικό μίσθωσης τύπωνε παύλα στη θέση των ονομάτων.
      - name: Καμία μεγάλη παύλα σε ελληνικό κείμενο — blocking
        run: node scripts/guard-em-dash.mjs

      # Το `auto-fit` τεντώνει τις στήλες για να γεμίσει το πλάτος. Σε πλακίδια
      # σωστό, σε πεδία καταστροφικό: δύο πεδία ποσού σε οθόνη 1.500 γίνονταν
      # δύο κουτιά των 750 για τέσσερα ψηφία. Καστάνια: μόνο προς τα κάτω.
      - name: Τα πεδία φόρμας δεν τεντώνονται — blocking
        run: node scripts/guard-form-grid.mjs

      # Και ο φύλακας που φυλάει τους φύλακες: κάθε εντολή του package.json που
      # δείχνει σε scripts/ οφείλει να καλείται από workflow. Οι τρεις από πάνω
      # έλειπαν ακριβώς επειδή το να προσθέσεις εντολή είναι μία γραμμή, ενώ το
      # να τη συνδέσεις είναι άλλο αρχείο και άλλη στιγμή.
      - name: Κάθε φύλακας συνδεδεμένος στο CI — blocking
        run: node scripts/guard-ci-coverage.mjs

      # Οι αποθηκευμένες τιμές παρόχων γερνάνε σιωπηλά ενώ η οθόνη δείχνει
      # ημερομηνία ελέγχου στον χρήστη ως εγγύηση. Εδώ προειδοποιεί· το
      # προγραμματισμένο workflow ανοίγει issue.
      - name: Price freshness (προειδοποιητικό)
        run: npm run prices

      - name: Tests (domain + messaging verifiers)
        run: npm run test

      - name: Production build
        run: npm run build
