name: CI

# Quality gate: runs on every pull request to main and on feature-branch pushes.
# Typecheck, the domain test-suite, and a production build must pass; lint is
# reported but non-blocking (informational). Fast, no secrets, no deploy — this
# only verifies the code is sound before it can be merged.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']

permissions:
  contents: read

# Collapse the PR-event and push-event runs of the SAME branch into one group
# (head_ref is set on pull_request, ref_name on push — both resolve to the branch
# name), so a feature branch with an open PR doesn't run CI twice in parallel.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security scan (secrets / forbidden files) — blocking
        run: npm run security

      - name: Lint (informational)
        run: npm run lint || true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (domain + messaging verifiers)
        run: npm run test

      - name: Production build
        run: npm run build
