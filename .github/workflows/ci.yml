name: CI

# Quality gate: runs on every pull request to main and on feature-branch pushes.
# A secret scan, the lint-debt ratchet (error count may only go down), typecheck,
# the domain test-suite, and a production build must all pass. Fast, no secrets,
# no deploy — this only verifies the code is sound before it can be merged.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']

permissions:
  contents: read

# Collapse the PR-event and push-event runs of the SAME branch into one group
# (head_ref is set on pull_request, ref_name on push — both resolve to the branch
# name), so a feature branch with an open PR doesn't run CI twice in parallel.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security scan (secrets / forbidden files) — blocking
        run: npm run security

      - name: Lint ratchet (errors may only go down) — blocking
        run: npm run lint:ratchet

      - name: Typecheck
        run: npx tsc --noEmit

      # Το tsc ΔΕΝ πιάνει το σύνορο server/πελάτη: ο τύπος είναι σωστός, η τιμή
      # στον χρόνο εκτέλεσης όχι. Όταν Server Component διάβασε `T` από το
      # `'use client'` Theme.tsx, ολόκληρο το δημόσιο site (αρχική, «Ποιοι
      # είμαστε», Απόρρητο, Όροι) έδειχνε «Κάτι πήγε στραβά» — με το build
      # απολύτως πράσινο. Αυτός ο έλεγχος είναι το μόνο πράγμα που το πιάνει.
      - name: Server/client boundary (τιμές από module πελάτη) — blocking
        run: node scripts/check-server-imports.mjs

      # Οι edge functions ΔΕΝ καλύπτονται από το tsc: το tsconfig.json εξαιρεί
      # ρητά το `supabase/`, επειδή τρέχουν σε Deno και όχι σε Node. Μέχρι σήμερα
      # αυτό σήμαινε ότι ο ΠΡΩΤΟΣ έλεγχος τύπων τους γινόταν τη στιγμή του deploy
      # στην παραγωγή — και μάλιστα ΜΕΤΑ το `db push`, δηλαδή με τα migrations ήδη
      # εφαρμοσμένα. Ένα σφάλμα τύπου σήμαινε βάση μπροστά, κώδικα πίσω.
      #
      # Η έκδοση 2.1.4 είναι αυτή που κάνει vendor το Supabase edge-runtime.
      - name: Typecheck edge functions (Deno)
        run: npx --yes deno@2.1.4 check supabase/functions/*/index.ts

      # Τα χρήματα ζουν σε δύο πίνακες (bills και expenses) και κάθε οθόνη που
      # τα αθροίζει μόνη της μπορεί να βγάλει άλλο σύνολο. Βρέθηκαν τρεις τέτοιες
      # οθόνες, με τρία διαφορετικά νούμερα για το ίδιο ακίνητο. Δεν κρασάρει
      # τίποτα: απλώς ο ιδιοκτήτης που θα εντοπίσει ΕΝΑ λάθος νούμερο παύει να
      # εμπιστεύεται όλα τα υπόλοιπα και δίκαια. Ratchet: το χρέος μόνο πέφτει.
      # Μία ανάθεση σε επίπεδο module πάνω σε πακέτο UMD έκλεισε την εφαρμογή
      # έξω: `qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']`. Όταν
      # ο bundler άλλαξε σχήμα interop, η γραμμή πέταξε ΠΡΙΝ αποδοθεί οτιδήποτε
      # και δεν φόρτωσε ολόκληρος ο πίνακας ελέγχου. Κανένα error boundary δεν
      # πιάνει chunk που δεν αξιολογήθηκε ποτέ.
      - name: No module-scope work on packages — blocking
        run: node scripts/check-module-init.mjs

      - name: Money reads through one core — blocking
        run: node scripts/money-reads.mjs
      # ═══════════════════════════════════════════════════════════════════
      # ΟΙ ΦΥΛΑΚΕΣ, ΣΕ ΕΝΑ ΒΗΜΑ ΑΝΤΙ ΓΙΑ ΠΕΝΗΝΤΑ ΠΕΝΤΕ
      # ─────────────────────────────────────────────────────────────────
      # Καθε φύλακας είχε δικό του βήμα εδώ. Δύο κόστη και το δεύτερο είναι
      # το σοβαρό:
      #
      #   ΧΡΟΝΟΣ. Καθε βήμα ξεκινούσε δική του διεργασία Node και ξαναδιάβαζε
      #   το δέντρο. Μετρημένο: 29,6 δευτερόλεπτα σειριακά, 13,5 με τέσσερις
      #   παράλληλες θέσεις. Δεκαέξι δευτερόλεπτα σε κάθε εκτέλεση και οι
      #   εκτελέσεις πληρώνονται από το μηνιαίο όριο.
      #
      #   ΞΕΧΑΣΜΕΝΟΙ ΦΥΛΑΚΕΣ. Το να γράψεις φύλακα είναι ένα αρχείο· το να τον
      #   συνδέσεις είναι άλλο αρχείο, άλλη σύνταξη, άλλη στιγμή. Η φυσική
      #   κίνηση σταματά στην πρώτη και έχει ήδη συμβεί τρεις φορές.
      #
      # Ο εκτελεστής ΑΝΑΚΑΛΥΠΤΕΙ τους φύλακες από το σύστημα αρχείων: αν το
      # αρχείο λέγεται scripts/guard-*.mjs, τρέχει. Δεν υπάρχει κατάλογος να
      # ενημερώσεις, οπότε η κατηγορία «γραμμένος και μη συνδεδεμένος» έγινε
      # αδύνατη. Το γιατί υπάρχει ο καθένας είναι γραμμένο στην κεφαλίδα του
      # δικού του αρχείου, που είναι και το μόνο σημείο όπου διαβάζεται.
      # ═══════════════════════════════════════════════════════════════════
      - name: Οι φύλακες του αποθετηρίου — blocking
        run: node scripts/run-guards.mjs

      # ═══════════════════════════════════════════════════════════════════
      # ΚΑΙ ΟΙ ΙΔΙΟΙ ΟΙ ΦΥΛΑΚΕΣ ΔΟΚΙΜΑΖΟΝΤΑΙ, ΜΕ ΤΟ ΣΦΑΛΜΑ ΤΟΥΣ ΞΑΝΑΦΕΡΜΕΝΟ.
      # Μέσα σε μία εβδομάδα βρέθηκαν τρεις φύλακες που τύπωναν πράσινο πάνω
      # από πραγματικά σφάλματα και ένα pathspec που έκρυβε σαράντα αρχεία
      # από δέκα φύλακες. Το πράσινο του βήματος από πάνω σημαίνει κάτι μόνο
      # αν κάθε φύλακας μπορεί να αποδείξει ότι κοκκινίζει.
      #
      # Ο πάγκος εφαρμόζει μια στοχευμένη μετάλλαξη ανά φύλακα, απαιτεί
      # κόκκινο, την ξηλώνει και στο τέλος συγκρίνει το `git status` με αυτό
      # της αρχής. Φύλακας χωρίς μετάλλαξη είναι αποτυχία, όχι παράλειψη.
      # ═══════════════════════════════════════════════════════════════════
      - name: Οι φύλακες αποδεικνύουν ότι πιάνουν κάτι — blocking
        run: npm run guards:verify

      - name: Γραψίματα με έλεγχο σφάλματος — blocking
        run: node scripts/unchecked-writes.mjs

      # Το app έχει σκοτεινό θέμα. Ένα καρφωμένο #fff ή #111 δουλεύει σε ένα από
      # τα δύο θέματα και σπάει ΣΙΩΠΗΛΑ στο άλλο — καμία δοκιμή δεν το πιάνει,
      # γιατί τίποτα δεν κρασάρει: απλώς κάποιος βλέπει λευκά γράμματα σε λευκό.
      # Μετρήθηκαν 232 μοναδικά χρώματα, 57 μπλε και 23 πράσινα, από τρεις ξένες
      # παλέτες μαζί. Ratchet: το υπάρχον χρέος επιτρέπεται, το νέο όχι.
      - name: Χρώμα μόνο από tokens — blocking
        run: node scripts/color-ratchet.mjs
      - name: Το «σήμερα» βγαίνει από ελληνική ώρα — blocking
        run: node scripts/greek-time.mjs
      - name: Οι μεταναστεύσεις τρέχουν σε πραγματικό Postgres — blocking
        run: bash scripts/db-replay.sh
      - name: Price freshness (προειδοποιητικό)
        run: npm run prices

      - name: Tests (domain + messaging verifiers)
        run: npm run test

      # ═══ ΤΑ ΦΥΛΛΑ EXCEL, ΔΙΑΒΑΣΜΕΝΑ ΑΠΟ ΞΕΝΕΣ ΥΛΟΠΟΙΗΣΕΙΣ ═════════════════
      # Το αρχείο το γράφει η SheetJS και το ξαναγράφουμε εμείς στο χέρι για
      # όσα εκείνη δεν γράφει. Να το ξαναδιαβάσουμε με την ΙΔΙΑ βιβλιοθήκη δεν
      # αποδεικνύει τίποτα: θα συγχωρούσε ακριβώς τα λάθη που κάνει. Εδώ το
      # ανοίγουν η openpyxl (Python) και η calamine (Rust) και μετριέται ότι
      # κάθε πίνακας είναι ζυγισμένος, δεκάδες κάτω από δεκάδες.
      #
      # Το LibreOffice ΔΕΝ εγκαθίσταται εδώ: είναι μισό γιγαμπάιτ για κάθε
      # τρέξιμο. Το σενάριο το λέει ρητά ότι το παραλείπει και το ίδιο βήμα
      # τρέχει πλήρες τοπικά, με «npm run xlsx».
      # Η Pillow ΔΕΝ είναι προαιρετική εδώ: χωρίς αυτήν η openpyxl δεν διαβάζει
      # εικόνες και κάθε φύλλο βγαίνει «χωρίς σήμα» ενώ το σήμα είναι μέσα στο
      # αρχείο. Το βήμα δεν είχε εκτελεστεί ποτέ στο CI για να το δείξει.
      - name: Τα βιβλία Excel ανοίγουν σε ξένους αναγνώστες — blocking
        run: |
          pip install --quiet openpyxl python-calamine Pillow
          npm run xlsx

      - name: Production build
        run: npm run build

      # ΜΕΤΑ ΤΟ ΧΤΙΣΙΜΟ, ΚΑΙ ΜΟΝΟ ΤΟΤΕ. Ο έλεγχος διαβάζει το .next/static, όχι
      # τον πηγαίο: πιάνει το μυστικό που δεν υπάρχει σε κανένα αρχείο του
      # αποθετηρίου αλλά κατέληξε στο πακέτο του πελάτη επειδή το διάβασε
      # component με «use client».
      - name: Κανένα μυστικό στο πακέτο του πελάτη — blocking
        run: npm run security:bundle

  # ═══ Ο,ΤΙ ΚΡΙΝΕΤΑΙ ΜΟΝΟ ΑΦΟΥ ΖΩΓΡΑΦΙΣΤΕΙ, ΣΕ ΔΙΚΟ ΤΟΥ JOB ═══════════════════
  # Διάταξη σε οκτώ παράθυρα από 320 ώς 1440 και σε πλάγιο κινητό, αντίθεση στα
  # δύο θέματα και ορατότητα εστίασης μετρημένη σε εικονοστοιχεία. Καμία από τις
  # τρεις δεν υπάρχει πριν την υπολογίσει ο περιηγητής, οπότε κανένας έλεγχος
  # πηγαίου δεν τις πιάνει.
  #
  # ΓΙΑΤΙ ΜΟΝΟ ΤΟΥ. Είναι η μακρύτερη σάρωση της εφαρμογής — μετρημένο 731
  # δευτερόλεπτα — και είναι η μόνη που θέλει ζωντανό διακομιστή, δηλαδή και το
  # χτίσιμο από πάνω της. Μέσα στο `verify` το πήγαινε στα είκοσι τέσσερα λεπτά,
  # δηλαδή πάλι στο χείλος της ακύρωσης. Το χτίσιμο γίνεται δεύτερη φορά εδώ και
  # αυτό κοστίζει: κοστίζει λιγότερο από έναν έλεγχο που δεν τελειώνει.
  rendered:
    name: Ο,τι κρίνεται αφού ζωγραφιστεί
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chromium για τις σουίτες περιηγητή
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Ο,τι κρίνεται αφού ζωγραφιστεί — blocking
        run: |
          npm run start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          npm run e2e:rendered

  # ═══════════════════════════════════════════════════════════════════════════
  # ΟΙ ΣΑΡΩΣΕΙΣ ΠΕΡΙΗΓΗΤΗ, ΣΕ ΔΙΚΑ ΤΟΥΣ JOBS
  # ─────────────────────────────────────────────────────────────────────────
  # ΤΟ CI ΑΚΥΡΩΝΟΤΑΝ ΣΤΑ ΕΙΚΟΣΙ ΛΕΠΤΑ. Ολα έτρεχαν σε ΕΝΑ job, στη σειρά:
  # έλεγχος τύπων, φύλακες, δεκατρείς σαρώσεις περιηγητή, μεταναστεύσεις σε
  # πραγματικό Postgres, δοκιμές, χτίσιμο. Καθε νέα σάρωση πρόσθετε λεπτά στην
  # ΙΔΙΑ ουρά και η ουρά χτύπησε το ταβάνι του δρομέα στη μέση της διάταξης.
  #
  # ΤΟ ΑΚΥΡΩΜΕΝΟ ΕΙΝΑΙ ΧΕΙΡΟΤΕΡΟ ΑΠΟ ΤΟ ΚΟΚΚΙΝΟ. Το κόκκινο λέει τι έσπασε· το
  # ακυρωμένο δεν λέει τίποτα και μοιάζει με αστοχία υποδομής, οπότε το φυσικό
  # επόμενο βήμα είναι «ξαναπάτα το» — δηλαδή ακριβώς η κίνηση που περνά έναν
  # έλεγχο χωρίς να τον τρέξει ποτέ ώς το τέλος.
  #
  # Τα τρία jobs δεν εξαρτώνται μεταξύ τους και ξεκινούν μαζί. Η διάταξη έχει
  # δικό της job επειδή είναι η μόνη που μετριέται σε λεπτά και όχι σε
  # δευτερόλεπτα: δώδεκα συσκευές επί τριάντα οκτώ σκηνές.
  # ═══════════════════════════════════════════════════════════════════════════
  scans:
    name: Σαρώσεις περιηγητή
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chromium για τις σουίτες περιηγητή
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      # Ο πίνακας ελέγχου ζει πίσω από σύνδεση, οπότε καμία σουίτα δημόσιων
      # σελίδων δεν τον φτάνει. Ο πάγκος αποδίδει τα ΙΔΙΑ στοιχεία που τρέχουν
      # στην παραγωγή, χωρίς διακομιστή και χωρίς λογαριασμό και τα πατά με
      # αληθινό πληκτρολόγιο σε πραγματικό Chromium.
      - name: Πληκτρολόγιο στον πίνακα ελέγχου — blocking
        run: npm run e2e:keyboard

      # Η απλότητα ήταν ο μόνος βαθμός γραμμένος με το μάτι και ό,τι δεν
      # μετριέται δεν πέφτει ποτέ. Ο ίδιος πάγκος ανοίγει τον ΑΛΗΘΙΝΟ οδηγό
      # ακινήτου σε έξι περιπτώσεις χρήστη και μετρά τα ΟΡΑΤΑ κουτιά: όχι όσα
      # υπάρχουν στο DOM, όσα βλέπει ο άνθρωπος πριν πατήσει «Περισσότερα».
      # Καστάνια: το όριο μόνο κατεβαίνει.
      - name: Απλότητα στον οδηγό ακινήτου — blocking
        run: npm run e2e:simple

      # ΣΕΡΝΕΤΑΙ Η ΝΟΑ ΜΕ ΤΟ ΔΑΧΤΥΛΟ; Το πλωτό κουμπί σερνόταν με ποντίκι και
      # κολλούσε με άγγιγμα: ο περιηγητής έπαιρνε τη χειρονομία για κύλιση στην
      # πρώτη κίνηση. Σύρσιμο 220px μετακινούσε το κουμπί 18px. Καμία δοκιμή με
      # συνθετικά συμβάντα δεν το πιάνει — παρακάμπτουν τη μηχανή χειρονομιών.
      # Εδώ στέλνονται ΑΛΗΘΙΝΑ αγγίγματα μέσω CDP, σε τηλέφωνο και σε ταμπλέτα.
      - name: Η Νόα σέρνεται με το δάχτυλο — blocking
        run: npm run e2e:touch

      # ΤΙ ΑΚΟΥΕΙ ΟΠΟΙΟΣ ΔΕΝ ΒΛΕΠΕΙ ΤΟΝ ΠΙΝΑΚΑ ΕΛΕΓΧΟΥ. Ολοι οι έλεγχοι
      # προσβασιμότητας κοίταζαν τις πέντε δημόσιες σελίδες: ο πίνακας ελέγχου,
      # δηλαδή ό,τι βλέπει ο χρήστης ΑΦΟΥ πληρώσει, δεν είχε μετρηθεί ποτέ. Εδώ
      # ρωτιέται το ίδιο το δέντρο προσβασιμότητας του Chrome για 27 οθόνες:
      # όνομα σε κάθε χειριστήριο, όνομα που δεν είναι η τιμή, κρυμμένα τα
      # διακοσμητικά σχήματα, ορατή εστίαση με ΑΛΗΘΙΝΟ Tab.
      - name: Προσβασιμότητα στον πίνακα ελέγχου — blocking
        run: npm run e2e:a11y:dash

      # ΠΟΣΕΣ ΟΘΟΝΕΣ ΚΥΛΙΣΗΣ ΘΕΛΕΙ ΚΑΘΕ ΚΑΡΤΕΛΑ. Ολοι οι υπόλοιποι έλεγχοι
      # διάταξης ρωτούν πράγματα οριζόντια· κανένας δεν ρωτούσε πόσο ΜΑΚΡΙΑ
      # είναι μια οθόνη, που είναι ακριβώς το πράγμα που δεν φαίνεται σε
      # στιγμιότυπο και το νιώθει μόνο το δάχτυλο. Καστάνια, όχι όριο: κόβει
      # μόνο όταν μια καρτέλα ΜΑΚΡΥΝΕΙ σε σχέση με τη μετρημένη βάση.
      - name: Καμία καρτέλα δεν μάκρυνε — blocking
        run: npm run e2e:vertical

      # ΤΑ ΧΕΙΡΙΣΤΗΡΙΑ ΠΟΥ ΚΑΘΟΝΤΑΙ ΣΕ ΣΕΙΡΑ ΕΧΟΥΝ ΤΟ ΙΔΙΟ ΥΨΟΣ. Καμία μέτρηση
      # δεν ρωτούσε αν δύο κουτιά δίπλα δίπλα ξεκινούν στην ίδια γραμμή. Δεν
      # κόβεται τίποτα, δεν ξεφεύγει τίποτα, περνούν όλοι οι φύλακες — και η
      # γραμμή φαίνεται πρόχειρη. Μετρήθηκαν έξι γραμμές εργαλείων με δύο ώς
      # τέσσερα διαφορετικά ύψη η καθεμία, με αιτία πάντα την ίδια: το ύψος
      # έβγαινε από κατακόρυφο padding αντί να δηλώνεται.
      - name: Τα χειριστήρια μιας σειράς στοιχίζονται — blocking
        run: npm run e2e:align

      # ΚΑΙ Η ΕΤΙΚΕΤΑ ΤΟΥΣ ΠΙΑΝΕΙ ΤΙΣ ΙΔΙΕΣ ΓΡΑΜΜΕΣ. Η στοίχιση χειριστηρίων
      # μετρά τα ΚΟΥΤΙΑ· μπορεί να είναι όλα στην ίδια ευθεία και να χαλάει η
      # ετικέτα από πάνω τους. Σε σειρά πέντε πεδίων, δύο ετικέτες τσάκιζαν σε
      # δεύτερη γραμμή και τα κουτιά τους ξεκινούσαν δεκαοκτώ εικονοστοιχεία πιο
      # χαμηλά. Ο σαρωτής ανοίγει και τα διπλωμένα πάνελ: εκεί ζει το μισό
      # προϊόν και χωρίς άνοιγμα έβγαζε καθαρή σκηνή που δεν είχε δει.
      - name: Οι ετικέτες μιας σειράς έχουν το ίδιο ύψος — blocking
        run: npm run e2e:labels

      # ΤΙ ΣΚΕΠΑΖΕΙ ΤΟ ΠΛΩΤΟ ΚΟΥΜΠΙ ΤΗΣ ΝΟΑΣ. Ζει σε κάθε καρτέλα της εφαρμογής
      # και σε καμία σκηνή του πάγκου: ό,τι σκέπαζε δεν το μετρούσε κανείς. Ο
      # χρήστης το είδε πάνω σε τιμές. Η σάρωση αποδίδει τη Νόα πάνω σε κάθε
      # σκηνή και μετρά τομές με ορατό κείμενο, στην κορυφή και στο τέλος της
      # κύλισης — στο τέλος δεν επιτρέπεται καμία, γι' αυτό υπάρχει το περιθώριο.
      - name: Το κουμπί της Νόας δεν σκεπάζει κείμενο — blocking
        run: npm run e2e:noa

      # ΤΑ ΠΛΑΚΙΔΙΑ ΜΙΑΣ ΣΕΙΡΑΣ ΕΙΝΑΙ ΙΣΑ ΚΟΥΤΙΑ. Ο χρήστης φωτογράφισε τέσσερα
      # πλακίδια στη σειρά με τέσσερα ύψη και τα νούμερά τους σε τέσσερις
      # γραμμές: δύο είχαν σημείωση από κάτω, δύο όχι και ο βοηθός διάταξης
      # στοίχιζε στο κάτω άκρο. Καμία άλλη σάρωση δεν ρωτούσε το απλούστερο που
      # βλέπει το μάτι — είναι τα κουτιά ίσα;
      - name: Οι σειρές πλακιδίων είναι ζυγισμένες — blocking
        run: npm run e2e:tilerow

      # ΜΙΑ ΣΤΗΛΗ ΑΡΙΘΜΩΝ ΕΧΕΙ ΕΝΑ ΔΕΞΙ ΑΚΡΟ. Οταν ό,τι έρχεται ΜΕΤΑ τον αριθμό
      # υπάρχει μόνο σε μερικές γραμμές (ποσοστό, σήμα υπέρβασης, βελάκι), κάθε
      # γραμμή τελειώνει αλλού και η λίστα διαβάζεται πρόχειρη. Καστάνια: μόνο
      # προς τα κάτω.
      - name: Οι στήλες αριθμών έχουν ένα δεξί άκρο — blocking
        run: npm run e2e:numcol

      # Η ΕΓΓΡΑΦΗ ΕΙΝΑΙ Η ΜΟΝΗ ΟΘΟΝΗ ΠΟΥ ΒΛΕΠΕΙ ΚΑΘΕ ΝΕΟΣ ΧΡΗΣΤΗΣ, ΚΑΙ ΕΣΠΑΣΕ
      # ΣΕ ΠΡΑΓΜΑΤΙΚΗ ΧΡΗΣΗ. Το κουμπί κλείδωνε στο «Δημιουργία…» μόλις κάποιος
      # πατούσε «Γράψε άλλη» για να διορθώσει τη διεύθυνσή του. Καμία δοκιμή
      # μονάδας δεν το έπιανε: η κατάσταση είναι σωστή σε κάθε ΜΕΜΟΝΩΜΕΝΟ βήμα
      # και λάθος μόνο στη ΣΕΙΡΑ «υποβολή, πίσω, ξανά».
      - name: Η εγγραφή αντέχει δεύτερη προσπάθεια — blocking
        run: npm run e2e:signup

  layout:
    name: Διάταξη σε δώδεκα συσκευές
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chromium για τις σουίτες περιηγητή
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      # ΔΙΑΒΑΖΕΤΑΙ ΤΟ ΚΕΙΜΕΝΟ; Η εφαρμογή είχε ελέγχους για οριζόντια κύλιση,
      # για στόχους αφής και για ύψη πλακιδίων. Κανένας δεν ρωτούσε το
      # απλούστερο πράγμα που βλέπει ο άνθρωπος. Και τα δύο σφάλματα που
      # ανέφερε ο χρήστης ήταν ακριβώς αυτό: κομμένες ετικέτες στην εικόνα του
      # προϊόντος, πίνακας που πήγαινε πέρα δώθε.
      #
      # Ο σαρωτής μοιράζει τις συσκευές σε τόσες παράλληλες θέσεις όσοι οι
      # πυρήνες του δρομέα. Το `E2E_LANES` υπάρχει για να μπορεί να μηδενιστεί
      # η παραλληλία αν χρειαστεί να διαβαστεί καθαρή σειρά εξόδου.
      - name: Τίποτα κομμένο, τίποτα πάνω στο άλλο — blocking
        run: npm run e2e:layout

  # ═══ ΜΙΑ ΠΟΡΤΑ, ΤΡΙΑ JOBS ══════════════════════════════════════════════════
  # Με τρία ξεχωριστά jobs, «πράσινο CI» παύει να είναι ΕΝΑ σημάδι: κάποιος
  # μπορεί να δει το `verify` πράσινο και να νομίσει ότι πέρασαν όλα. Αυτό το
  # job δεν τρέχει τίποτα — υπάρχει για να υπάρχει ΕΝΑ όνομα που κοκκινίζει αν
  # κοκκινίσει οτιδήποτε, ώστε η προστασία κλάδου να έχει τι να απαιτήσει.
  #
  # Το `always()` είναι απαραίτητο: χωρίς αυτό το job παραλείπεται όταν ένα
  # `needs` αποτύχει και το παραλειπόμενο μετριέται ως ΜΗ αποτυχία.
  #
  # ΤΟ `!cancelled()` ΕΙΝΑΙ ΤΟ ΔΕΥΤΕΡΟ ΜΙΣΟ ΚΑΙ ΤΟ ΕΜΑΘΑ ΑΚΡΙΒΑ. Καθε push σε
  # κλάδο με ανοιχτό PR ξυπνά ΔΥΟ εκτελέσεις (push και pull_request)· η ομάδα
  # συγχρονισμού κρατά τη μία και ακυρώνει την άλλη, όπως πρέπει. Με σκέτο
  # `always()` όμως η πύλη της ακυρωμένης έτρεχε κανονικά, έβλεπε «cancelled»
  # στα needs της και κοκκίνιζε: κόκκινο «Ολα πράσινα» πάνω στο PR, που δεν
  # έλεγε τίποτα για τον κώδικα. Στην ακύρωση η πύλη ΠΑΡΑΛΕΙΠΕΤΑΙ — δεν έχει
  # τίποτα να κρίνει· η άλλη εκτέλεση είναι εκείνη που κρίνει.
  gate:
    name: Ολα πράσινα
    runs-on: ubuntu-latest
    needs: [verify, scans, layout, rendered]
    if: always() && !cancelled()
    steps:
      - name: Καμία πύλη δεν έμεινε ανοιχτή
        run: |
          echo "verify:   ${{ needs.verify.result }}"
          echo "scans:    ${{ needs.scans.result }}"
          echo "layout:   ${{ needs.layout.result }}"
          echo "rendered: ${{ needs.rendered.result }}"
          test "${{ needs.verify.result }}"   = success
          test "${{ needs.scans.result }}"    = success
          test "${{ needs.layout.result }}"   = success
          test "${{ needs.rendered.result }}" = success
