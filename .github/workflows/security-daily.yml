name: Ασφάλεια, καθημερινά

# ═══════════════════════════════════════════════════════════════════════════
# ΓΙΑΤΙ ΥΠΑΡΧΕΙ ΑΥΤΟ ΤΟ WORKFLOW
#
# Το ci.yml τρέχει όταν αλλάζει ο ΚΩΔΙΚΑΣ. Η ασφάλεια όμως χαλάει και χωρίς να
# αλλάξει γραμμή: μια αδυναμία δημοσιεύεται σε πακέτο που ήδη χρησιμοποιούμε,
# και το repo που ήταν καθαρό χθες είναι ευάλωτο σήμερα, με πράσινο CI.
#
# Την ημέρα που γράφτηκε αυτό, ο έλεγχος βρήκε επτά αδυναμίες υψηλής
# σοβαρότητας σε εξαρτήσεις — καμία δεν είχε εισαχθεί από εμάς και καμία δεν
# φαινόταν πουθενά. Έξι διορθώθηκαν με αναβάθμιση. Η έβδομη ήταν στον αναλυτή
# φύλλων Excel, χωρίς διαθέσιμη διόρθωση και οδήγησε σε αλλαγή αρχιτεκτονικής:
# το ξένο αρχείο διαβάζεται πλέον σε Web Worker (lib/core/readSheet.ts).
#
# ΤΙ ΚΑΝΕΙ ΚΑΘΕ ΜΕΡΑ
#   1. Επιτίθεται στατικά στο ίδιο το repo με τους φύλακες ασφαλείας: πολιτικές
#      RLS, πίνακες μόνο-υπηρεσίας, γέφυρα pg_net, διαρροή κωδικών, CSP,
#      μυστικά σε παρακολουθούμενα αρχεία.
#   2. Ρωτά το μητρώο για νέες αδυναμίες στις εξαρτήσεις.
#   3. Αν κάτι σπάσει, ανοίγει ΕΝΑ issue — και δεν ανοίγει δεύτερο όσο το
#      πρώτο είναι ανοιχτό, γιατί ένας συναγερμός που επαναλαμβάνεται κάθε
#      πρωί παύει να διαβάζεται μέσα σε μια εβδομάδα.
#
# ΤΙ ΔΕΝ ΚΑΝΕΙ. Δεν χτυπά την παραγωγή και δεν δοκιμάζει διαπιστευτήρια. Δεν
# υπάρχει άδεια για επίθεση σε τρίτους (Supabase, Vercel) και μια αυτόματη
# δοκιμή που περνά τα σύνορά μας θα ήταν η ίδια παραβίαση.
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 04:15 UTC, δηλαδή νωρίς το πρωί ώρα Ελλάδας: το εύρημα περιμένει στο
    # γραφείο πριν αρχίσει η μέρα, όχι στη μέση της.
    - cron: '15 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: security-daily
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── Στατική επίθεση στο ίδιο το repo ────────────────────────────────
      # Κάθε βήμα με `continue-on-error` ώστε να ΤΡΕΞΟΥΝ ΟΛΑ: μια αποτυχία στο
      # πρώτο δεν επιτρέπεται να κρύψει τα υπόλοιπα πέντε ευρήματα.
      - name: Πολιτικές RLS
        id: rls
        continue-on-error: true
        run: npm run --silent rls-coverage

      - name: Καμία γραμμή σε ξένο ακίνητο
        id: parent
        continue-on-error: true
        run: npm run --silent rls-parent-scope

      - name: Πίνακες μόνο-υπηρεσίας
        id: svc
        continue-on-error: true
        run: npm run --silent service-tables

      - name: Γέφυρα pg_net
        id: bridge
        continue-on-error: true
        run: npm run --silent http-bridge

      - name: Πολιτικές RLS χωρίς κλήση ανά γραμμή
        id: initplan
        continue-on-error: true
        run: npm run --silent rls-initplan

      - name: Διαρροή κωδικών
        id: pwd
        continue-on-error: true
        run: npm run --silent password-leak

      - name: Δηλωμένες εξωτερικές κλήσεις (CSP)
        id: csp
        continue-on-error: true
        run: npm run --silent csp-connect

      - name: Μυστικά σε παρακολουθούμενα αρχεία
        id: secrets
        continue-on-error: true
        run: npm run --silent security

      # ── Αδυναμίες εξαρτήσεων ────────────────────────────────────────────
      # Μόνο high και critical: το moderate σε εργαλείο ανάπτυξης θα άνοιγε
      # issue κάθε δεύτερη μέρα και θα εκπαίδευε στο να αγνοείται ο έλεγχος.
      - name: Αδυναμίες εξαρτήσεων
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Σύνοψη
        id: sum
        run: |
          set -euo pipefail
          fails=""
          add() { [ "$1" = "failure" ] && fails="${fails}- $2"$'\n' || true; }
          add "${{ steps.rls.outcome }}"      "Πολιτικές RLS"
          add "${{ steps.parent.outcome }}"   "Γραμμή σε ξένο ακίνητο"
          add "${{ steps.svc.outcome }}"      "Πίνακες μόνο-υπηρεσίας"
          add "${{ steps.bridge.outcome }}"   "Γέφυρα pg_net"
          add "${{ steps.initplan.outcome }}" "Πολιτικές RLS ανά γραμμή"
          add "${{ steps.pwd.outcome }}"      "Διαρροή κωδικών"
          add "${{ steps.csp.outcome }}"      "CSP"
          add "${{ steps.secrets.outcome }}"  "Μυστικά σε αρχεία"
          add "${{ steps.audit.outcome }}"    "Αδυναμίες εξαρτήσεων"
          if [ -z "$fails" ]; then
            echo "Καθαρό." && echo "clean=1" >> "$GITHUB_OUTPUT"
          else
            echo "clean=0" >> "$GITHUB_OUTPUT"
            { echo "report<<EOF"; echo "$fails"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Ειδοποίηση
        if: steps.sum.outputs.clean == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.sum.outputs.report }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Ασφάλεια: ο ημερήσιος έλεγχος βρήκε ευρήματα"
          # Ένα issue τη φορά. Ο δεύτερος πανομοιότυπος συναγερμός δεν προσθέτει
          # πληροφορία· προσθέτει θόρυβο και ο θόρυβος σκοτώνει την προσοχή.
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          body=$(printf 'Ο ημερήσιος έλεγχος ασφαλείας απέτυχε στα εξής:\n\n%s\nΑναλυτικά: %s\n\nΤο workflow δεν χτυπά την παραγωγή: ελέγχει τον κώδικα, τις πολιτικές της βάσης και τις εξαρτήσεις.' "$REPORT" "$RUN")
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
