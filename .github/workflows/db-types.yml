# ═══════════════════════════════════════════════════════════════════════════
# Παραγωγή των τύπων TypeScript από το ΠΡΑΓΜΑΤΙΚΟ σχήμα της βάσης.
#
# ΓΙΑΤΙ ΥΠΑΡΧΕΙ ΩΣ WORKFLOW ΚΑΙ ΟΧΙ ΩΣ ΤΟΠΙΚΗ ΕΝΤΟΛΗ:
# Το `supabase gen types` απαιτεί Personal Access Token. Ο ιδιοκτήτης δουλεύει
# αποκλειστικά online (GitHub, Vercel, Supabase) και δεν έχει τερματικό — ούτε
# πρέπει να χρειαστεί. Το token υπάρχει ΗΔΗ ως GitHub secret για το deploy,
# οπότε εδώ δεν προστίθεται κανένα νέο μυστικό: μόνο ένα κουμπί.
#
# ΤΙ ΛΥΝΕΙ ΠΡΑΓΜΑΤΙΚΑ:
# Οι δύο Supabase clients (lib/supabase/client.ts, server.ts) δημιουργούνται
# ΧΩΡΙΣ παράμετρο σχήματος. Χωρίς αυτήν, κάθε `select()` επιστρέφει `any`: κάθε
# πεδίο που διαβάζεται από τη βάση είναι ανέλεγκτο. Τα ~429 `any` του lint δεν
# είναι 429 αβλεψίες — είναι 429 συμπτώματα ΕΝΟΣ σφάλματος ρύθμισης.
#
# Το ουσιαστικό κέρδος δεν είναι ο αριθμός του lint. Είναι ότι ένα migration που
# μετονομάζει στήλη θα σπάει το build αντί να γυρίζει σιωπηλά `null` σε
# πραγματικό χρήστη — και ότι τα `as any` πάνω σε ΠΟΣΑ γίνονται ελεγμένα.
#
# ΓΙΑΤΙ ΑΝΟΙΓΕΙ PR ΚΑΙ ΔΕΝ ΓΡΑΦΕΙ ΣΤΟ main:
# Το παραγόμενο αρχείο είναι η αποτύπωση της παραγωγικής βάσης. Αν αλλάξει
# απρόσμενα (π.χ. κάποιος πείραξε σχήμα από το dashboard), θέλουμε να το δούμε
# ως diff πριν μπει — όχι να βρεθεί ξαφνικά στο main.
#
# ΑΣΦΑΛΕΙΑ: το database.types.ts ΔΕΝ περιέχει μυστικά. Μόνο ονόματα πινάκων,
# στηλών και τύπους — δηλαδή ό,τι ήδη περιγράφουν τα migrations στο repo.
# ═══════════════════════════════════════════════════════════════════════════

name: Τύποι βάσης

on:
  # Το κουμπί: Actions → «Τύποι βάσης» → Run workflow.
  workflow_dispatch:
  # Κάθε φορά που αλλάζει το σχήμα, οι τύποι προτείνονται αυτόματα. Χωρίς αυτό
  # θα αποκλίνουν σιωπηλά από τη βάση με το πρώτο migration που θα ξεχάσουμε.
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: db-types
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Το ίδιο environment με το deploy, ώστε να λυθεί το ίδιο secret.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Πάντα από την ΠΑΡΑΓΩΓΗ: αυτή είναι η αυθεντική μορφή του σχήματος.
      PROJECT_REF: aromvduuxtcrzmwwvnej
      OUT: lib/supabase/database.types.ts

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Έλεγχος ότι υπάρχει το token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Λείπει το secret SUPABASE_ACCESS_TOKEN (environment: production)."
            echo "Φτιάξ' το στο Supabase → Account → Access Tokens και βάλ' το στα GitHub secrets."
            exit 1
          fi

      - name: Παραγωγή τύπων
        run: |
          mkdir -p "$(dirname "$OUT")"
          # Το --project-id δεν χρειάζεται `link`, άρα ούτε κωδικό βάσης.
          supabase gen types typescript --project-id "$PROJECT_REF" > "$OUT"
          # Αμυντικό: ένα άδειο ή κολοβό αρχείο θα «περνούσε» και θα έσπαγε το
          # build αργότερα, με μήνυμα που δεν δείχνει εδώ.
          if [ ! -s "$OUT" ] || ! grep -q "export type Database" "$OUT"; then
            echo "::error::Το παραγόμενο αρχείο δεν μοιάζει έγκυρο (λείπει το export type Database)."
            head -20 "$OUT" || true
            exit 1
          fi
          echo "Γραμμές: $(wc -l < "$OUT")"

      - name: Υπάρχει διαφορά;
        id: diff
        run: |
          if git diff --quiet -- "$OUT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Οι τύποι είναι ήδη ενημερωμένοι — καμία αλλαγή." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 Το σχήμα άλλαξε· ανοίγει PR με τους νέους τύπους." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ΓΙΑΤΙ ΜΕ `gh` ΚΑΙ ΟΧΙ ΜΕ ΕΤΟΙΜΟ ACTION: το βήμα χρειάζεται δικαίωμα
      # εγγραφής στο repo και στα PR. Ένα action τρίτου με αυτά τα δικαιώματα
      # είναι επιφάνεια επίθεσης εφοδιαστικής αλυσίδας για κάτι που κάνουν
      # πέντε γραμμές bash. Το `gh` είναι προεγκατεστημένο στον runner.
      - name: Άνοιγμα ή ενημέρωση PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=chore/db-types
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ξεκινάμε ΠΑΝΤΑ από το τρέχον main: ο κλάδος κρατά μόνο το παραγόμενο
          # αρχείο, ποτέ παλιό ιστορικό που θα δημιουργούσε ψεύτικες συγκρούσεις.
          git checkout -B "$BRANCH"
          git add "$OUT"
          git commit -m "chore(db): τύποι από το σχήμα παραγωγής" -m \
            "Παραγόμενο αρχείο. Δεν γράφεται με το χέρι: χειρόγραφοι τύποι αποκλίνουν σιωπηλά από τη βάση με το πρώτο migration, και τότε ο TypeScript δίνει ΨΕΥΤΙΚΗ ασφάλεια αντί για καθόλου."
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            echo "Το PR υπάρχει ήδη και ενημερώθηκε."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(db): ενημέρωση τύπων από το σχήμα παραγωγής" \
              --body "$(cat <<'PRBODY'
          Παραγόμενο αυτόματα από `supabase gen types typescript`, πάνω στο σχήμα της **παραγωγής**.

          **Δεν περιέχει μυστικά** — μόνο ονόματα πινάκων, στηλών και τύπους, δηλαδή ό,τι ήδη
          περιγράφουν τα migrations του repo.

          ### Τι ξεκλειδώνει

          Οι δύο Supabase clients δημιουργούνται χωρίς παράμετρο σχήματος, οπότε κάθε `select()`
          επιστρέφει `any`. Μόλις συνδεθεί το `<Database>`, ο compiler ελέγχει για πρώτη φορά κάθε
          πεδίο που διαβάζεται από τη βάση — συμπεριλαμβανομένων των casts πάνω σε **ποσά**.

          ### Αν το diff δείχνει αλλαγές που δεν περίμενες

          Σημαίνει ότι το σχήμα της παραγωγής διαφέρει από ό,τι περιγράφουν τα migrations, συνήθως
          επειδή κάτι εφαρμόστηκε από το dashboard. Αξίζει να κοιταχτεί πριν το merge.
          PRBODY
          )"
          fi
