name: Database backup (free-tier safety net)

# Supabase Free has no scheduled backups, so we take our own: a daily logical dump
# (schema + data + roles) uploaded as a private GitHub Actions artifact, restorable
# with psql. This is off-site (different provider) — a real DR net until you upgrade
# to Pro (managed backups + PITR).
#
# ⚠ The artifact contains REAL customer data. Two protections:
#   • BACKUP_PASSPHRASE is REQUIRED. The dump is GPG-symmetric-encrypted (AES256)
#     before upload. Decrypt with:
#       gpg --decrypt --batch --passphrase "<pass>" data.sql.gpg > data.sql
#     If the secret is missing the job FAILS and uploads nothing — an encrypted
#     backup or none at all, never a plaintext dump of customer data.
#   • Keep this repository PRIVATE. Retention is 30 days.
# Before selling at scale, move to Pro backups (managed + PITR) or a KMS-encrypted
# bucket with longer retention.
#
# Reuses the same two secrets as the deploy pipeline:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD   (+ optional BACKUP_PASSPHRASE)

on:
  schedule:
    - cron: '0 2 * * *'      # every day at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: aromvduuxtcrzmwwvnej

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dump roles, schema and data
        run: |
          mkdir -p backup
          supabase db dump --linked --role-only -f backup/roles.sql
          supabase db dump --linked            -f backup/schema.sql
          supabase db dump --linked --data-only -f backup/data.sql
          ls -lh backup

      # Fail-CLOSED: χωρίς passphrase ΔΕΝ ανεβαίνει τίποτα. Ένα κρυπτογραφημένο
      # αντίγραφο ή κανένα — ποτέ dump πελατών σε καθαρό κείμενο σε artifact.
      - name: Encrypt dump (required)
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            rm -rf backup
            {
              echo "## ❌ Το αντίγραφο ασφαλείας ΔΕΝ δημιουργήθηκε"
              echo
              echo "Λείπει το repo secret \`BACKUP_PASSPHRASE\`, οπότε το dump θα ανέβαινε"
              echo "σε **καθαρό κείμενο** με πραγματικά δεδομένα πελατών (ονόματα, ΑΦΜ,"
              echo "διευθύνσεις, μισθωτήρια). Το job σταματά αντί να το ανεβάσει."
              echo
              echo "**Διόρθωση:** Settings → Secrets and variables → Actions → New repository secret"
              echo "με όνομα \`BACKUP_PASSPHRASE\` και μια ισχυρή, φυλαγμένη φράση."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BACKUP_PASSPHRASE is not set — refusing to upload a plaintext dump of customer data."
            exit 1
          fi
          for f in backup/roles.sql backup/schema.sql backup/data.sql; do
            gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase "$BACKUP_PASSPHRASE" -o "$f.gpg" "$f"
            rm -f "$f"
          done
          echo "🔒 Αντίγραφο κρυπτογραφημένο (AES256) πριν το ανέβασμα." >> "$GITHUB_STEP_SUMMARY"

      - name: Date stamp
        id: ts
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: supabase-backup-${{ steps.ts.outputs.date }}
          path: backup/
          retention-days: 30

# Δες και: .github/workflows/backup-watchdog.yml — ελέγχει καθημερινά ότι αυτό
# εδώ ΟΝΤΩΣ τρέχει και παράγει κρυπτογραφημένο αντίγραφο και ανοίγει issue αν
# περάσουν δύο μέρες χωρίς. Χωρίς τον φύλακα, η αποτυχία εδώ είναι σιωπηλή.
