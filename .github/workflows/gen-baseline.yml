name: Generate DB baseline (one-off)

# One-off utility (audit finding 16): dumps the PRODUCTION public schema and
# commits it as the first migration (00000000000000_baseline.sql) on the working
# branch, so a from-scratch rebuild has the base tables the incremental migrations
# assume. Read-only against the database (pg_dump); the only write is a git commit
# of the generated file. Removed once the baseline lands.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/design-system-consolidation-31vwux
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production
        run: supabase link --project-ref aromvduuxtcrzmwwvnej

      - name: Dump production public schema as the baseline migration
        run: supabase db dump --linked -f supabase/migrations/00000000000000_baseline.sql

      - name: Commit the baseline to the working branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/00000000000000_baseline.sql
          git commit -m "chore(db): production public-schema baseline (finding 16)" -m "Generated by the gen-baseline workflow from the live production schema."
          git push origin HEAD:claude/design-system-consolidation-31vwux
