name: Supabase deploy

# Migrations-as-code, applied automatically. Claude writes versioned SQL under
# supabase/migrations/ and edge functions under supabase/functions/; on push this
# pipeline applies them to the Supabase project. No human touches the dashboard, and
# no always-on write token exists anywhere — the CLI authenticates from short-lived
# GitHub Actions secrets only. This is the professional, least-privilege way to keep
# a production database automated AND safe.
#
# One-time setup (GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   a Supabase Personal Access Token (sbp_…)
#   SUPABASE_DB_PASSWORD    the project's database password
# The project ref is public (in the dashboard URL), so it is not a secret.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: aromvduuxtcrzmwwvnej

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Self-healing migration history. The remote history table can contain
      # versions that have no file in supabase/migrations/ (schema applied via the
      # dashboard/SQL editor in the past, or a half-finished CLI run). `db push`
      # aborts on those with "Remote migration versions not found in local
      # migrations directory". Rather than ever asking a human to run a repair by
      # hand, we detect every remote-only version from `migration list` and mark it
      # `reverted` in the *bookkeeping* table — this only edits history, never the
      # live schema, so nothing is dropped. Idempotent: on a clean history this is a
      # no-op. This keeps the pipeline green through any future drift, untouched.
      - name: Reconcile migration history
        run: |
          set -euo pipefail
          # Columns: LOCAL | REMOTE | TIME. A remote-only row has an empty LOCAL
          # cell and a numeric REMOTE cell -> that version needs reverting.
          orphans="$(
            supabase migration list --linked 2>/dev/null \
              | awk -F'|' 'NR>2 { gsub(/[^0-9]/,"",$1); gsub(/[^0-9]/,"",$2);
                                  if ($1=="" && $2!="") print $2 }' \
              | tr '\n' ' '
          )"
          if [ -n "${orphans// /}" ]; then
            echo "Reverting orphaned remote migration versions: $orphans"
            supabase migration repair --status reverted $orphans
          else
            echo "Migration history is clean — nothing to reconcile."
          fi

      # Applies every migration not yet recorded in the remote history table.
      # All our migrations are idempotent, so a re-applied one is a safe no-op.
      - name: Apply database migrations
        run: supabase db push

      # Edge functions for the messaging system. verify_jwt is governed by
      # supabase/config.toml; the cron-called ones stay --no-verify-jwt.
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy send-lifecycle-email  --no-verify-jwt
          supabase functions deploy schedule-email-outbox --no-verify-jwt
          supabase functions deploy dispatch-message       --no-verify-jwt
