name: Supabase deploy

# Migrations-as-code, applied automatically. Claude writes versioned SQL under
# supabase/migrations/ and edge functions under supabase/functions/; on push this
# pipeline applies them to the Supabase project. No human touches the dashboard, and
# no always-on write token exists anywhere — the CLI authenticates from short-lived
# GitHub Actions secrets only. This is the professional, least-privilege way to keep
# a production database automated AND safe.
#
# One-time setup (GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN          a Supabase Personal Access Token (sbp_…), account-scoped
#   SUPABASE_DB_PASSWORD           the PRODUCTION project's database password
#   STAGING_SUPABASE_DB_PASSWORD   the STAGING project's database password
# The project ref is public (in the dashboard URL), so it is not a secret.
#
# Environment split (prod ≠ dev): a push to `main` deploys to PRODUCTION; a push
# to any feature branch (claude/**) deploys to the STAGING project, so migrations
# and functions are validated against a throwaway copy before they reach real
# customer data. The one Personal Access Token manages both projects.

on:
  push:
    # main → production; feature branches (claude/**) → staging. The migration
    # baseline (00000000000000_baseline.sql + companions) lets a fresh staging DB
    # rebuild from migrations/ alone, so feature branches validate against a
    # throwaway copy before prod (see docs/infra/staging-setup.md).
    branches: [main, 'claude/**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      # ΤΟ config.toml ΕΛΕΙΠΕ, ΚΑΙ ΕΙΝΑΙ ΤΟ ΑΡΧΕΙΟ ΠΟΥ ΚΡΙΝΕΙ ΑΝ ΜΙΑ ΣΥΝΑΡΤΗΣΗ
      # ΕΙΝΑΙ ΠΡΟΣΒΑΣΙΜΗ. Μια διόρθωση του verify_jwt εκεί δεν ενεργοποιούσε
      # deploy, οπότε το αποθετήριο έλεγε ένα και η παραγωγή έκανε άλλο.
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  # Manual trigger: run from a feature branch → deploys to staging; from main → production.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Per-environment lock: a staging deploy (feature branch) must not serialize
# behind or block a production deploy (main), and vice-versa.
concurrency:
  group: supabase-deploy-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # main → production project; any feature branch → staging project.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ github.ref == 'refs/heads/main' && 'aromvduuxtcrzmwwvnej' || 'rheufrfscmngpjayxgln' }}
      SUPABASE_DB_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_DB_PASSWORD || secrets.STAGING_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Show deploy target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Deploying to PRODUCTION ($SUPABASE_PROJECT_REF)"
          else
            echo "Deploying to STAGING ($SUPABASE_PROJECT_REF)"
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Self-healing migration history. The remote history table can contain
      # versions that have no file in supabase/migrations/ (schema applied via the
      # dashboard/SQL editor in the past, or a half-finished CLI run). `db push`
      # aborts on those with "Remote migration versions not found in local
      # migrations directory". Rather than ever asking a human to run a repair by
      # hand, we detect every remote-only version from `migration list` and mark it
      # `reverted` in the *bookkeeping* table — this only edits history, never the
      # live schema, so nothing is dropped. Idempotent: on a clean history this is a
      # no-op. This keeps the pipeline green through any future drift, untouched.
      - name: Reconcile migration history
        run: |
          set -euo pipefail
          # Columns: LOCAL | REMOTE | TIME. A remote-only row has an empty LOCAL
          # cell and a numeric REMOTE cell -> that version needs reverting. We keep
          # stderr visible (a `migration list` failure must not be swallowed) and
          # record every action to the job summary so an unattended repair on
          # production is never silent.
          listing="$(supabase migration list --linked)"
          orphans="$(
            printf '%s\n' "$listing" \
              | awk -F'|' 'NR>2 { gsub(/[^0-9]/,"",$1); gsub(/[^0-9]/,"",$2);
                                  if ($1=="" && $2!="") print $2 }' \
              | tr '\n' ' '
          )"
          if [ -n "${orphans// /}" ]; then
            echo "Reverting orphaned remote migration versions: $orphans"
            echo "⚠️ Reconcile reverted orphaned remote versions on **$SUPABASE_PROJECT_REF**: \`$orphans\` (bookkeeping only, no schema change)." >> "$GITHUB_STEP_SUMMARY"
            supabase migration repair --status reverted $orphans
          else
            echo "Migration history is clean — nothing to reconcile."
            echo "✅ Migration history clean on $SUPABASE_PROJECT_REF — nothing to reconcile." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Applies every migration not yet recorded in the remote history table.
      # All our migrations are idempotent, so a re-applied one is a safe no-op.
      #
      # ΓΙΑΤΙ --include-all. Το `db push` αρνείται να εφαρμόσει τοπική
      # μετανάστευση που ΤΑΞΙΝΟΜΕΙΤΑΙ ΠΡΙΝ την τελευταία που έχει η βάση:
      #
      #   Found local migration files to be inserted before the last migration
      #   on remote database. Rerun the command with --include-all flag.
      #
      # Συμβαίνει όποτε δύο κλάδοι γράφουν μεταναστεύσεις παράλληλα, ή όταν μια
      # εκτέλεση σταματήσει στη μέση: η βάση κρατά κεφαλή 20260815, ένα αρχείο
      # 20260814 δεν εφαρμόστηκε ποτέ και ο αγωγός κοκκινίζει για πάντα χωρίς
      # να λείπει τίποτα πραγματικά. Ακριβώς αυτό βρήκε το staging στις
      # 19/08/2026 με το 20260814110000_ical_stay_identity.sql.
      #
      # Ο ΕΛΕΓΧΟΣ ΤΗΣ ΣΕΙΡΑΣ ΔΕΝ ΜΑΣ ΠΡΟΣΤΑΤΕΥΕΙ ΕΔΩ, γιατί οι μεταναστεύσεις
      # αυτού του repo είναι γραμμένες ιδιοδύναμα (`create or replace`,
      # `if not exists`, `on conflict do nothing`) και δεν εξαρτώνται από το
      # ποια εφαρμόστηκε πρώτη. Οποια ΔΕΝ είναι, είναι σφάλμα της ίδιας της
      # μετανάστευσης και θα έσκαγε ούτως ή άλλως στην πρώτη εφαρμογή.
      #
      # Η ΕΝΑΛΛΑΚΤΙΚΗ ΗΤΑΝ ΧΕΙΡΟΤΕΡΗ: χειροκίνητο `migration repair` από
      # άνθρωπο, δηλαδή ακριβώς η επέμβαση που όλος αυτός ο αγωγός υπάρχει για
      # να μη χρειάζεται ποτέ.
      - name: Apply database migrations
        run: supabase db push --include-all

      # Deploy every edge function in one pass. Each function's verify_jwt is
      # declared explicitly in supabase/config.toml (cron/token/service = false,
      # user-facing = true), so no per-function flags are needed and nothing is
      # left undeployed.
      #
      # Retry: το `functions deploy` κάνει content-diff ανά function («No change
      # found in Function: X»), άρα μια επανάληψη ξαναδοκιμάζει μόνο ό,τι δεν
      # πέρασε — ασφαλώς idempotent. Καλύπτει παροδικά: 5xx του Supabase API,
      # network glitch του runner, φευγαλέο σφάλμα registry.
      #
      # ΔΕΝ καλύπτει μόνιμη διακοπή CDN — γι' αυτό τα imports είναι πλέον
      # `npm:@supabase/supabase-js@<ακριβής>` και όχι CDN URL. Στις 27/07/2026 το
      # esm.sh γύρισε 522 και δεν μπορούσε να γίνει deploy ΤΙΠΟΤΑ· αν εκείνη τη
      # στιγμή είχε σπάσει η παραγωγή, το `git revert` θα έδειχνε πάλι στον ίδιο
      # νεκρό host. Το retry δεν λύνει αυτό. Το specifier το λύνει.
      #
      # ΣΚΟΠΙΜΑ ΧΩΡΙΣ retry το `db push` παραπάνω: τα migrations είναι forward-only
      # και μια τυφλή επανάληψη πάνω σε ημιτελή εφαρμογή είναι χειρότερη από μια
      # καθαρή αποτυχία.
      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if supabase functions deploy; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$(( attempt * 30 ))
              echo "::warning::functions deploy απέτυχε (προσπάθεια $attempt/3) — retry σε ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::functions deploy απέτυχε και στις 3 προσπάθειες"
          exit 1

  # Ένα ειδοποιητικό που ανοίγει αλλά δεν κλείνει ποτέ, παύει να είναι
  # ειδοποιητικό: μετά την πρώτη αποτυχία το κόκκινο μένει για πάντα και το
  # επόμενο πραγματικό πρόβλημα δεν ξεχωρίζει από το παλιό. Ακριβώς αυτό
  # συνέβη — το deploy διορθώθηκε στο run 41 και το issue #184 έμεινε ανοιχτό
  # για 7 επιτυχημένα runs. Ο κύκλος κλείνει εδώ: επιτυχία ⇒ κλείνει το issue
  # του ΙΔΙΟΥ περιβάλλοντος, με σχόλιο που λέει ποιο run το έλυσε.
  resolve-on-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the failure issue for this environment
        uses: actions/github-script@v9
        with:
          script: |
            const target = context.ref === 'refs/heads/main' ? 'production' : 'staging';
            const title = `🔴 Supabase deploy failed (${target})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Μόνο το issue ΑΥΤΟΥ του περιβάλλοντος: ένα πράσινο staging deploy
            // δεν επιτρέπεται να κλείσει μια ανοιχτή αποτυχία της παραγωγής.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
              per_page: 100,
            });
            for (const issue of open.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Το deploy προς **${target}** πέτυχε ξανά — κλείνει αυτόματα.\n\n- Run: ${runUrl}\n- Commit: ${context.sha}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed #${issue.number} — ${target} deploy is green again.`);
            }

  # If a deploy fails, open (or reuse) a GitHub issue so the failure is never
  # silent — the free alternative to a paid alerting integration. Idempotent:
  # a single open "deploy failure" issue is reused and re-commented rather than
  # spawning a new one on every red run.
  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const target = context.ref === 'refs/heads/main' ? 'production' : 'staging';
            const title = `🔴 Supabase deploy failed (${target})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **Supabase deploy** workflow failed on \`${context.ref}\` → **${target}**.`,
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Migrations/functions were **not** fully applied. Check the run log, fix, and re-push.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
            });
            const hit = existing.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deploy-failure'],
              });
            }
