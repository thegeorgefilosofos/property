name: Supabase deploy

# Migrations-as-code, applied automatically. Claude writes versioned SQL under
# supabase/migrations/ and edge functions under supabase/functions/; on push this
# pipeline applies them to the Supabase project. No human touches the dashboard, and
# no always-on write token exists anywhere — the CLI authenticates from short-lived
# GitHub Actions secrets only. This is the professional, least-privilege way to keep
# a production database automated AND safe.
#
# One-time setup (GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN          a Supabase Personal Access Token (sbp_…), account-scoped
#   SUPABASE_DB_PASSWORD           the PRODUCTION project's database password
#   STAGING_SUPABASE_DB_PASSWORD   the STAGING project's database password
# The project ref is public (in the dashboard URL), so it is not a secret.
#
# Environment split (prod ≠ dev): a push to `main` deploys to PRODUCTION; a push
# to any feature branch (claude/**) deploys to the STAGING project, so migrations
# and functions are validated against a throwaway copy before they reach real
# customer data. The one Personal Access Token manages both projects.

on:
  push:
    # main → production; feature branches (claude/**) → staging. The migration
    # baseline (00000000000000_baseline.sql + companions) lets a fresh staging DB
    # rebuild from migrations/ alone, so feature branches validate against a
    # throwaway copy before prod (see docs/infra/staging-setup.md).
    branches: [main, 'claude/**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  # Manual trigger: run from a feature branch → deploys to staging; from main → production.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main → production project; any feature branch → staging project.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ github.ref == 'refs/heads/main' && 'aromvduuxtcrzmwwvnej' || 'rheufrfscmngpjayxgln' }}
      SUPABASE_DB_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_DB_PASSWORD || secrets.STAGING_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show deploy target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Deploying to PRODUCTION ($SUPABASE_PROJECT_REF)"
          else
            echo "Deploying to STAGING ($SUPABASE_PROJECT_REF)"
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Self-healing migration history. The remote history table can contain
      # versions that have no file in supabase/migrations/ (schema applied via the
      # dashboard/SQL editor in the past, or a half-finished CLI run). `db push`
      # aborts on those with "Remote migration versions not found in local
      # migrations directory". Rather than ever asking a human to run a repair by
      # hand, we detect every remote-only version from `migration list` and mark it
      # `reverted` in the *bookkeeping* table — this only edits history, never the
      # live schema, so nothing is dropped. Idempotent: on a clean history this is a
      # no-op. This keeps the pipeline green through any future drift, untouched.
      - name: Reconcile migration history
        run: |
          set -euo pipefail
          # Columns: LOCAL | REMOTE | TIME. A remote-only row has an empty LOCAL
          # cell and a numeric REMOTE cell -> that version needs reverting.
          orphans="$(
            supabase migration list --linked 2>/dev/null \
              | awk -F'|' 'NR>2 { gsub(/[^0-9]/,"",$1); gsub(/[^0-9]/,"",$2);
                                  if ($1=="" && $2!="") print $2 }' \
              | tr '\n' ' '
          )"
          if [ -n "${orphans// /}" ]; then
            echo "Reverting orphaned remote migration versions: $orphans"
            supabase migration repair --status reverted $orphans
          else
            echo "Migration history is clean — nothing to reconcile."
          fi

      # Applies every migration not yet recorded in the remote history table.
      # All our migrations are idempotent, so a re-applied one is a safe no-op.
      - name: Apply database migrations
        run: supabase db push

      # Deploy every edge function in one pass. Each function's verify_jwt is
      # declared explicitly in supabase/config.toml (cron/token/service = false,
      # user-facing = true), so no per-function flags are needed and nothing is
      # left undeployed.
      - name: Deploy Edge Functions
        run: supabase functions deploy

  # If a deploy fails, open (or reuse) a GitHub issue so the failure is never
  # silent — the free alternative to a paid alerting integration. Idempotent:
  # a single open "deploy failure" issue is reused and re-commented rather than
  # spawning a new one on every red run.
  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.ref === 'refs/heads/main' ? 'production' : 'staging';
            const title = `🔴 Supabase deploy failed (${target})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **Supabase deploy** workflow failed on \`${context.ref}\` → **${target}**.`,
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Migrations/functions were **not** fully applied. Check the run log, fix, and re-push.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
            });
            const hit = existing.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deploy-failure'],
              });
            }
