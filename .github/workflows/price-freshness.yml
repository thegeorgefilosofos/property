name: Price freshness

# ═══════════════════════════════════════════════════════════════════════════
# ΤΟ ΠΡΟΒΛΗΜΑ ΠΟΥ ΛΥΝΕΙ
# Η οθόνη σύγκρισης παρόχων γράφει «Τελευταίος έλεγχος: Ιούλιος 2026» και ο
# χρήστης το διαβάζει ως εγγύηση ότι τα νούμερα ισχύουν. Αν κανείς δεν
# ξανακοιτάξει τις πηγές, η ίδια πρόταση θα λέει το ίδιο και τον Δεκέμβριο.
# Τίποτα δεν θα έχει σπάσει, κανένα test δεν θα κοκκινίσει και ο χρήστης θα
# παίρνει αποφάσεις αλλαγής παρόχου πάνω σε τιμές περασμένης εποχής.
#
# ΤΙ ΚΑΝΕΙ
# Την 21η κάθε μήνα ελέγχει την ηλικία των τιμών στο data/price-sources.json.
# Η 21η επιλέχθηκε επειδή κάθε προμηθευτής δημοσιεύει το τυποποιημένο τιμολόγιο
# του επόμενου μήνα μέχρι τις 20 του τρέχοντος: την 21η υπάρχει τι να ελεγχθεί.
#
# ΤΙ ΔΕΝ ΚΑΝΕΙ
# Δεν κατεβάζει τιμές. Η αυτόματη άντληση από ιστοσελίδες παρόχων και
# συγκριτικών πλατφορμών παραβιάζει τους όρους χρήσης τους και σπάει με κάθε
# αλλαγή σελίδας, δηλαδή θα παρήγαγε λάθος τιμές με το κύρος του αυτοματισμού.
# Οι τιμές τις ενημερώνει άνθρωπος που διαβάζει τις δημοσιευμένες πηγές και
# αυτό το workflow απλώς δεν τον αφήνει να το ξεχάσει.
#
# ΠΩΣ ΕΙΔΟΠΟΙΕΙ
# Ανοίγει GitHub issue με τη λίστα των πηγών. Ένα issue είναι ΚΑΤΑΣΤΑΣΗ και όχι
# μήνυμα: μένει ανοιχτό μέχρι να γίνει η δουλειά, φαίνεται στην αρχική του repo
# και φτάνει ως ειδοποίηση στο κινητό. Δεν ανοίγει δεύτερο αν υπάρχει ήδη.
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 7 21 * *'   # 21η κάθε μήνα, 07:00 UTC
  workflow_dispatch:        # και με το χέρι, από την καρτέλα Actions

permissions:
  contents: read
  issues: write

concurrency:
  group: price-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Έλεγχος ηλικίας τιμών
        id: check
        run: |
          set +e
          OUT=$(node scripts/price-freshness.mjs --strict 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo 'report<<PRICE_EOF'
            echo "$OUT"
            echo 'PRICE_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "stale=$([ $CODE -ne 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Άνοιγμα issue αν οι τιμές παλιώσαν
        if: steps.check.outputs.stale == 'yes'
        uses: actions/github-script@v9
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const title = 'Οι τιμές παρόχων θέλουν έλεγχο';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'price-freshness', per_page: 5,
            });
            if (open.length) {
              core.info('Υπάρχει ήδη ανοιχτό issue. Δεν ανοίγει δεύτερο.');
              return;
            }
            const body = [
              'Οι αποθηκευμένες τιμές ξεπέρασαν το όριο φρεσκάδας.',
              '',
              'Η οθόνη σύγκρισης δείχνει την ημερομηνία τελευταίου ελέγχου στον χρήστη',
              'ως ένδειξη αξιοπιστίας. Παλιά ημερομηνία με φρέσκια εμφάνιση είναι ψέμα.',
              '',
              '```',
              process.env.REPORT || '',
              '```',
              '',
              '### Τι χρειάζεται',
              '1. Άνοιξε τις πηγές που αναφέρονται πιο πάνω.',
              '2. Διόρθωσε όσες τιμές άλλαξαν, στα αρχεία των παρόχων.',
              '3. Ενημέρωσε `checkedAt` και `label` στο `data/price-sources.json`.',
              '',
              'Το issue κλείνει μόνο του στον επόμενο έλεγχο, μόλις οι ημερομηνίες φρεσκάρουν.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['price-freshness'],
            });

      - name: Κλείσιμο issue όταν οι τιμές φρεσκάρουν
        if: steps.check.outputs.stale == 'no'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'price-freshness', per_page: 20,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Οι τιμές είναι πλέον εντός ορίου φρεσκάδας. Κλείνει αυτόματα.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
